<!--
  ============================================================
  CONFIGURATION FIREBASE — À FAIRE UNE SEULE FOIS
  ============================================================
  IMPORTANT : cette application contient des données
  personnelles sensibles (noms et adresses de ménages en
  difficulté, situations sociales, parcours d'insertion).
  L'accès par simple mot de passe saisi dans la page ne
  protégeait rien : les données étaient déjà chargées dans le
  navigateur avant toute vérification. Chaque personne a
  désormais un vrai compte Firebase, et c'est le serveur —
  et non le code de cette page — qui décide de ce qu'elle
  peut lire.

  ------------------------------------------------------------
  1. Créer le projet
  ------------------------------------------------------------
  a. https://console.firebase.google.com → "Créer un projet"
     (nom libre, Google Analytics inutile).
  b. "Firestore Database" → "Créer une base de données" →
     mode production → région Europe (eur3). La région
     européenne compte pour le RGPD : ne prenez pas us-central.

  ------------------------------------------------------------
  2. Activer la connexion par email
  ------------------------------------------------------------
  "Authentication" → "Get started" → onglet "Sign-in method"
  → activez "E-mail/Mot de passe". N'activez PAS "Anonyme".

  ------------------------------------------------------------
  3. Coller les règles de sécurité
  ------------------------------------------------------------
  Firestore Database → onglet "Règles" → remplacez tout par :

    rules_version = '2';
    service cloud.firestore {
      match /databases/{database}/documents {

        function compte() {
          return get(/databases/$(database)/documents/veh_users/$(request.auth.uid)).data;
        }
        function connecte() {
          return request.auth != null
            && exists(/databases/$(database)/documents/veh_users/$(request.auth.uid));
        }
        function estRole(r) {
          return connecte() && compte().role == r;
        }
        function equipe() {
          return estRole('admin') || estRole('collab');
        }

        // Annuaire des comptes : chacun lit le sien, seul
        // l'administrateur lit et modifie ceux des autres.
        match /veh_users/{uid} {
          allow read: if request.auth != null
                      && (request.auth.uid == uid || estRole('admin'));
          allow write: if estRole('admin');
        }

        // Données de l'association : réservées à l'équipe.
        // Un compte client n'y a jamais accès.
        match /veh_data/{docId} {
          allow read, write: if equipe();
        }

        // Espace client : chaque client ne lit que sa propre
        // fiche, écrite par l'équipe. C'est ce qui empêche un
        // client de voir les autres clients.
        match /veh_client_view/{clientId} {
          allow read: if equipe()
                      || (connecte() && compte().clientId == clientId);
          allow write: if equipe();
        }
      }
    }

  Ne remettez jamais "if true" ni "if request.auth != null"
  seul : la première rend la base publique, la seconde suffit
  à n'importe quel visiteur dès qu'un mode de connexion
  ouvert est activé.

  ------------------------------------------------------------
  4. Créer VOTRE compte administrateur (à la main, une fois)
  ------------------------------------------------------------
  a. Authentication → onglet "Users" → "Add user" → votre
     email + un mot de passe solide. Copiez l'UID affiché
     dans la liste (suite de lettres et de chiffres).
  b. Firestore Database → "Démarrer une collection" →
     ID de collection : veh_users
     ID du document  : collez l'UID copié
     Champs :  role  (chaîne)  = admin
               nom   (chaîne)  = Berger John
  Sans ce document, même vous ne pourrez rien lire : c'est
  lui qui vous donne le rôle. Les comptes suivants
  (collaborateurs, clients) se créent ensuite depuis
  l'application, onglet "Comptes".

  ------------------------------------------------------------
  5. Récupérer la configuration
  ------------------------------------------------------------
  Paramètres du projet (roue crantée) → "Vos applications" →
  icône "</>" (web) → donnez un nom → copiez l'objet de
  configuration affiché et collez-le ci-dessous à la place
  de l'objet actuel.

  (Ces identifiants ne sont pas des secrets : ils identifient
  le projet, ils ne donnent aucun droit. Ce sont les règles
  de l'étape 3 qui protègent les données.)
  ============================================================
-->

function copyToClipboard(text, onDone) {
  function fallback() {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand("copy"); onDone && onDone(); } catch (e) {}
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => onDone && onDone()).catch(fallback);
  } else {
    fallback();
  }
}

/* Les polices standard de jsPDF (Helvetica) sont limitées à l'encodage WinAnsi :
   tout caractère au-delà — €, tiret cadratin, œ, espace fine insécable — est
   silencieusement supprimé du PDF. Sans cette conversion, les factures sortent
   sans symbole monétaire et « main d'œuvre » devient « main d'uvre ». Les accents
   (é, à, ç) passent en revanche sans problème et sont conservés tels quels. */
function pdfSafe(text) {
  return String(text == null ? "" : text)
    .replace(/€/g, "EUR")
    .replace(/œ/g, "oe").replace(/Œ/g, "OE")
    .replace(/[—–]/g, "-")
    .replace(/[‘’]/g, "'")
    .replace(/[“”«»]/g, '"')
    .replace(/…/g, "...")
    .replace(/[   ]/g, " ")
    .replace(/[★☆]/g, "*");
}

function downloadTextAsPDF(title, bodyText, filename, photos) {
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "a4" });
    const marginLeft = 48;
    const marginTop = 56;
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const maxWidth = pageWidth - marginLeft * 2;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(14);
    doc.text(pdfSafe(title), marginLeft, marginTop);

    doc.setFont("helvetica", "normal");
    doc.setFontSize(10.5);
    const lines = doc.splitTextToSize(pdfSafe(bodyText), maxWidth);
    let y = marginTop + 28;
    const lineHeight = 14.5;
    lines.forEach((line) => {
      if (y > pageHeight - 50) { doc.addPage(); y = marginTop; }
      doc.text(line, marginLeft, y);
      y += lineHeight;
    });

    // Photos de contrôle : une par page, en pleine largeur utile. Elles ne sont
    // pas conservées dans la base (voir PassagesView) — ce PDF est le seul
    // moyen de les archiver, il faut donc le générer au moment du passage.
    (photos || []).forEach((p, i) => {
      doc.addPage();
      doc.setFont("helvetica", "bold");
      doc.setFontSize(11);
      doc.text(`Photo de contrôle ${i + 1}/${photos.length}`, marginLeft, marginTop);
      try {
        const format = /^data:image\/png/i.test(p.src) ? "PNG" : "JPEG";
        const boxW = maxWidth;
        const boxH = pageHeight - marginTop - 100;
        doc.addImage(p.src, format, marginLeft, marginTop + 18, boxW, boxH, undefined, "FAST");
      } catch (e) {
        doc.setFont("helvetica", "normal");
        doc.text("(image illisible)", marginLeft, marginTop + 30);
      }
    });

    doc.save(filename);
    return true;
  } catch (e) {
    return false;
  }
}

   Calcule les quantités par défaut d'un passage à partir de la fiche bien
--------------------------------------------------------------- */
function defaultQuantities(client) {
  if (!client) return {};
  return {
    cuisine: client.cuisineEquipee ? 1 : 0,
    sdb: Number(client.sdb) || 0,
    wc: Number(client.wc) || 0,
    sols: Number(client.surface) || 0,
    general: 1,
    cheminee: client.cheminee ? 1 : 0,
    barbecue: client.barbecue ? 1 : 0,
    piscine: client.piscine ? 1 : 0,
    spa: client.spa ? 1 : 0,
    animaux: client.animaux ? 1 : 0,
    kitGrandLit: Number(client.chambresGrandLit) || 0,
    kitPetitLit: Number(client.chambresPetitLit) || 0,
    servietteToilette: Number(client.totalLits) || 0,
    servietteBain: Number(client.totalLits) || 0,
    torchon: client.cuisineEquipee ? 2 : 0,
    oreiller: 0,
  };
}

function computeTotal(quantities) {
  return Object.entries(quantities).reduce((sum, [key, qty]) => sum + (PRICES[key] || 0) * (Number(qty) || 0), 0);
}

/* ---------------------------------------------------------------
   Suppression en deux temps — toute écriture part immédiatement dans
   Firestore et n'est pas annulable : un simple clic sur une corbeille
   ne doit jamais suffire à effacer un enregistrement.
--------------------------------------------------------------- */
function ConfirmDelete({ onConfirm, children, style }) {
  const [armed, setArmed] = useState(false);

  useEffect(() => {
    if (!armed) return;
    const t = setTimeout(() => setArmed(false), 5000);
    return () => clearTimeout(t);
  }, [armed]);

  if (!armed) {
    return (
      <Btn variant="danger" style={style} onClick={() => setArmed(true)} title="Supprimer">
        {children || <Trash2 size={13} />}
      </Btn>
    );
  }
  return (
    <span style={{ display: "inline-flex", gap: 6, ...style }}>
      <Btn variant="danger" onClick={() => { setArmed(false); onConfirm(); }}>Confirmer</Btn>
      <Btn variant="ghost" onClick={() => setArmed(false)}>Annuler</Btn>
    </span>
  );
}

      `Bonjour ${collab.nom},\n\nUne intervention vous a été attribuée :\n- Client : ${c?.nom || ""}\n- Adresse : ${c?.adresse || ""}\n- Date : ${a.date} à ${a.heure}\n- Type : ${a.type}${a.notes ? "\n- Notes : " + a.notes : ""}\n\nMerci de confirmer votre disponibilité.`
    );

        <div className="veh-cal-grid" style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 4 }}>
          {cells.map((d, i) => {
            if (!d) return <div key={i} />;
            const key = dateKey(d);
            const items = apptsFor(key);
            const isToday = key === todayISO();

L'association Vosges Entraide Habitat, association loi 1901, dont le siège social est situé au 32, rue Denfert-Rochereau, 88110 Raon-l'Étape, représentée par son Président, Monsieur Berger John, ci-après dénommée « le Prestataire »,

ET

${client.nom || "[Nom, Prénom ou raison sociale du client]"}, domicilié(e)/dont le siège est situé à ${client.adresse || "[adresse]"}, propriétaire ou exploitant du bien désigné ci-après, ci-après dénommé(e) « le Client »,

Il a été convenu ce qui suit :

Article 1 — Objet du contrat
Le présent contrat a pour objet de définir les conditions dans lesquelles le Prestataire fournit au Client, pour le bien meublé de tourisme désigné ci-dessous, une prestation de conciergerie portant sur :

Article 3 — Prestation « Consommables »
Le Prestataire réapprovisionne, avant chaque arrivée de voyageurs, les consommables suivants, facturés selon le forfait applicable à chaque pièce du bien :

3.1 Forfait Cuisine (par cuisine, par passage)

3.2 Forfait Salle de bain (par salle de bain, par passage)
Savon liquide ou savon dur, produits d'entretien sanitaires, sacs-poubelle salle de bain — inclus.
Forfait Salle de bain complet — ${eur(PRICES.sdb)} / salle de bain / passage

3.3 Forfait WC (par WC, par passage)

Forfait WC complet — ${eur(PRICES.wc)} / WC / passage

3.4 Forfait Ménage des sols (au m², pour l'ensemble du bien, par passage)
Nettoyage des sols (balayage et lavage), passage de l'aspirateur (moquettes, tapis, textiles) — inclus.
Forfait Ménage des sols complet — ${eur(PRICES.sols)} / m² / passage
Surface prise en compte : surface habitable totale du bien, telle que déclarée par le Client à l'article 2.

3.5 Forfait Entretien général (par bien, par passage)
Produits d'entretien surfaces et sanitaires, sacs-poubelle supplémentaires (pièces à vivre, chambres) — inclus.
Forfait Entretien général complet — ${eur(PRICES.general)} / passage

3.6 Prestations optionnelles selon équipements du bien
Ces prestations ne s'appliquent que si le bien dispose de l'équipement concerné, à cocher par le Client à l'article 2.

- Supplément présence d'animaux (temps de nettoyage supplémentaire) — ${eur(PRICES.animaux)} / passage

3.7 Périmètre précis de l'entretien piscine et spa
Afin d'éviter toute ambiguïté sur l'étendue de la prestation, il est précisé que :
- Concernant la piscine, la prestation du Prestataire se limite au nettoyage de surface (écumage, épuisette) et au contrôle visuel des abords. La gestion du traitement de l'eau (équilibre chimique, filtration, hivernage, dépannage des équipements techniques) ne relève pas de la présente prestation et reste entièrement à la charge du Client, le cas échéant via un professionnel spécialisé de son choix ;
- Concernant le spa/jacuzzi, la prestation comprend le nettoyage des filtres à chaque passage. Le renouvellement complet de l'eau n'est effectué que lorsqu'il est jugé nécessaire par le Prestataire (et non systématiquement à chaque passage), selon l'état constaté ;

- En cas de présence d'animaux domestiques appartenant aux voyageurs, le Client s'engage à en informer le Prestataire avant chaque séjour ; le supplément correspondant (article 3.6) sera alors automatiquement appliqué.

Le montant total de la prestation « Consommables » est calculé, pour chaque passage, en additionnant : (Forfait Cuisine × 1 si cuisine équipée) + (Forfait Salle de bain × nombre de salles de bain) + (Forfait WC × nombre de WC) + (Forfait Ménage des sols × surface habitable en m²) + Forfait Entretien général + (le cas échéant, Nettoyage cheminée/insert, Nettoyage barbecue, Entretien piscine, Entretien spa et/ou Supplément animaux).

Article 4 — Prestation « Location de linge »
Le Prestataire met à disposition, entretient et remplace le linge de maison suivant, entre chaque séjour. Le prix indiqué comprend la fourniture du linge, son lavage professionnel, et son repassage/pliage.

4.1 Kit Grand lit
Grand drap-housse, grand drap plat (ou housse de couette, selon literie), housse de couette grand format, 2 taies d'oreiller, protège-matelas grand format — inclus.
Kit Grand lit complet (fourniture + lavage inclus) — ${eur(PRICES.kitGrandLit)} / lit / séjour

4.2 Kit Petit lit
Petit drap-housse, petit drap plat (ou housse de couette, selon literie), housse de couette 1 personne, 1 taie d'oreiller, protège-matelas 1 personne — inclus.
Kit Petit lit complet (fourniture + lavage inclus) — ${eur(PRICES.kitPetitLit)} / lit / séjour

4.3 Linge complémentaire (à la pièce, sur demande)
- Serviette de toilette — ${eur(PRICES.servietteToilette)} / pièce / séjour
- Serviette de bain — ${eur(PRICES.servietteBain)} / pièce / séjour
- Torchon de cuisine — ${eur(PRICES.torchon)} / pièce / séjour

4.4 Option — Nettoyage des oreillers
Cette option porte sur le lavage périodique de l'oreiller lui-même (garnissage), en complément du changement systématique de la taie compris dans les kits ci-dessus. Recommandé tous les 3 à 6 mois ou en cas de séjour prolongé.
Nettoyage d'un oreiller (option) — ${eur(PRICES.oreiller)} / oreiller

4.5 Lits non déclarés et déplacements supplémentaires
Le nombre total de lits déclaré par le Client à l'article 2 sert de base à l'organisation de la prestation et au calcul du forfait initial. Il arrive qu'un bien annoncé pour un certain nombre de voyageurs comporte en réalité des couchages supplémentaires non signalés lors de la signature du contrat (lit dissimulé en combles, mezzanine, dépendance, canapé-lit non mentionné, etc.).

Dans une telle situation, si le Prestataire doit préparer un ou plusieurs lits non déclarés à l'article 2, ou effectuer un déplacement supplémentaire non prévu pour cette raison, les frais suivants s'appliquent, en plus du kit de linge correspondant (article 4.1 ou 4.2) :
- Frais de déplacement supplémentaire imprévu — ${eur(PRICES.fraisDeplacement)} / déplacement
- Préparation d'un lit non déclaré (en sus du kit de linge correspondant) — ${eur(PRICES.litNonDeclare)} / lit

Le Client s'engage à mettre à jour sans délai la composition du bien déclarée à l'article 2 dès qu'un couchage supplémentaire est identifié, afin d'éviter l'application de ces frais lors des passages suivants.

Article 4 bis — Formule d'engagement
Le Client souscrit à la formule « ${f.label} » (${f.duree}), ouvrant droit à ${f.remise > 0 ? `une remise de ${Math.round(f.remise * 100)} %` : "aucune remise"} sur l'ensemble des prestations facturées.${f.avantage ? " Avantage associé : " + f.avantage + "." : ""}

La remise est la contrepartie de la durée d'engagement souscrite. Elle n'est liée ni à la qualité de membre de l'association, ni à aucune adhésion, lesquelles n'ouvrent droit à aucune réduction tarifaire.

Article 5 — Modalités de commande et de facturation
Le Client communique au Prestataire, au minimum 48 heures avant chaque arrivée de voyageurs, le nombre de lits à préparer et la composition exacte du bien si celle-ci a été modifiée depuis la signature du contrat.

${f.paiement === "annuel"
? `La facturation est établie annuellement et payable d'avance, au début de chaque année contractuelle, sur la base de la composition du bien déclarée à l'article 2 et du nombre de passages prévisionnel convenu entre les parties. Un décompte détaillé des passages réellement effectués est établi à la fin de chaque année contractuelle ; l'écart éventuel est régularisé, en complément ou en déduction, sur la facture de l'année suivante ou, au terme du contrat, par remboursement.

Lorsque le présent contrat est conclu hors de l'établissement du Prestataire, aucun paiement ne peut être exigé ni reçu avant l'expiration d'un délai de sept jours à compter de sa conclusion, conformément à l'article L. 221-10 du code de la consommation. Le Client dispose en outre du droit de rétractation prévu par ce même code.`
: `La facturation est établie mensuellement, sur la base du détail des passages effectués, et réglée par virement dans un délai de 15 jours à réception de la facture.`}

Les forfaits ci-dessus sont indiqués hors taxes ; la TVA applicable, le cas échéant, sera précisée sur chaque facture selon le régime fiscal en vigueur pour l'association.

Article 6 — Obligations du Prestataire
- Assurer la disponibilité des consommables et du linge avant chaque arrivée annoncée dans les délais convenus ;
- Garantir la propreté et le bon état du linge fourni ;
- Signaler sans délai au Client toute anomalie constatée dans le bien lors de ses passages (dégradation, panne d'équipement, etc.).

Article 7 — Obligations du Client
- Communiquer les dates d'arrivée et de départ des voyageurs avec un préavis suffisant ;
- Permettre l'accès au bien au Prestataire dans les créneaux convenus ;
- Régler les factures dans les délais convenus à l'article 5 ;
- Signaler toute modification de la composition du bien (ajout de lits, changement de literie) pouvant affecter le calcul des forfaits.

Article 8 — Casse, perte et dégradation du linge
En cas de perte, de vol ou de dégradation du linge loué imputable aux voyageurs ou au Client, le remplacement sera facturé au Client sur la base du prix de remplacement à neuf de l'article concerné, sur présentation d'un justificatif.

Article 9 — Limitation de responsabilité et assurances
Le Prestataire déclare être couvert par une assurance responsabilité civile professionnelle pour les dommages qu'il pourrait causer dans l'exécution de ses prestations.

La responsabilité du Prestataire ne pourra être engagée pour :
- Les défauts, pannes ou dysfonctionnements préexistants des équipements du bien (électroménager, chauffage, piscine, spa, etc.) non signalés par le Client ;
- La qualité de l'eau, le fonctionnement technique ou la sécurité des installations de piscine et de spa, au-delà du périmètre strictement défini à l'article 3.7 ;
- Les dommages résultant d'un usage anormal du bien par les voyageurs, ou de circonstances hors du contrôle du Prestataire (force majeure, dégât des eaux, intempéries, coupure de courant, etc.) ;
- Les objets personnels laissés par les voyageurs ou le Client dans le bien.

Le Client est invité à vérifier que sa propre assurance (propriétaire non-occupant, location saisonnière) couvre les risques liés à l'exploitation du bien, ces garanties étant indépendantes du présent contrat de conciergerie.

Article 10 — Durée et résiliation
Le présent contrat est conclu pour une durée correspondant à la formule souscrite à l'article 4 bis (${f.duree}), renouvelable par tacite reconduction, sauf dénonciation par l'une des parties par lettre recommandée avec accusé de réception au moins un mois avant l'échéance.

Chaque partie peut résilier le présent contrat de manière anticipée en cas de manquement grave de l'autre partie à ses obligations, après mise en demeure restée sans effet pendant 15 jours.

Cette clause est la contrepartie exacte de l'avantage tarifaire consenti : elle ne place le Client que dans la situation qui aurait été la sienne sans engagement de durée. Aucune autre indemnité n'est due au titre de la résiliation.
` : ""}
Article 11 — Litiges
En cas de différend relatif à l'interprétation ou à l'exécution du présent contrat, les parties s'efforceront de trouver une solution amiable avant toute action contentieuse. À défaut, les tribunaux compétents du ressort du siège social du Prestataire seront seuls compétents.

  const [photos, setPhotos] = useState([]);
  const [extras, setExtras] = useState({ fraisDeplacement: 0, litNonDeclare: 0 });

  React.useEffect(() => { setQty(defaultQuantities(client)); setChecklist({}); setPhotos([]); setExtras({ fraisDeplacement: 0, litNonDeclare: 0 }); }, [clientId]);

  const applicablePostes = Object.entries(qty).filter(([, v]) => v > 0);
  const extrasTotal = (Number(extras.fraisDeplacement) || 0) * PRICES.fraisDeplacement + (Number(extras.litNonDeclare) || 0) * PRICES.litNonDeclare;
  // La remise de la formule d'engagement s'applique aussi au passage facturé,

  const formule = FORMULES.find((f) => f.id === client?.formule) || FORMULES[0];

  const brut = computeTotal(qty) + extrasTotal;

              <div key={p.id} style={{ position: "relative" }}>
                <img src={p.src} alt={p.name} style={{ width: 72, height: 72, objectFit: "cover", borderRadius: 8, border: `1px solid ${C.border}` }} />
                <button onClick={() => setPhotos(photos.filter((x) => x.id !== p.id))} style={{ position: "absolute", top: -6, right: -6, background: C.red, borderRadius: "50%", width: 18, height: 18, border: "none", color: "#fff", cursor: "pointer", fontSize: 10 }}>×</button>
              </div>
            ))}
          </div>
        )}
        {photos.length > 0 && (
          <Btn variant="ghost" onClick={rapportPhotosPDF} style={{ marginBottom: 12 }}>
            <Download size={13} /> Rapport de passage avec photos (PDF)
          </Btn>
        )}

        <Btn onClick={enregistrer} disabled={!allChecked}>
          <Check size={14} /> {allChecked ? "Valider et facturer le passage" : "Cochez tous les postes pour valider"}
        </Btn>
      </Card>

      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        <Card style={{ padding: 16 }}>
          <div style={{ fontSize: 12, color: C.textMuted }}>Total du passage</div>
          <div style={{ fontWeight: 700, fontSize: 26, color: C.amber }}>{eur(total)}</div>
          {remise > 0 && (
            <div style={{ fontSize: 11.5, color: C.textMuted, marginTop: 4 }}>
              Sous-total {eur(brut)} — remise formule {formule.label} {Math.round(remise * 100)}%
            </div>
          )}
        </Card>
        <Card style={{ padding: 16 }}>
          <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 10 }}>
            {viewerCollabId ? "Mes passages" : "Historique"} — {client?.nom}
          </div>
          {viewerCollabId && (
            <div style={{ fontSize: 11, color: C.textMuted, marginBottom: 8 }}>Vous ne voyez que les passages que vous avez saisis.</div>
          )}
          <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 340, overflowY: "auto" }}>
            {historique.length === 0 && <div style={{ color: C.textMuted, fontSize: 12.5 }}>Aucun passage enregistré.</div>}
            {historique.map((p) => (
              <div key={p.id} style={{ background: C.panel2, borderRadius: 8, padding: 9, fontSize: 12.5 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <span>{new Date(p.date + "T00:00").toLocaleDateString("fr-FR")}</span>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ color: C.amber, fontWeight: 600 }}>{eur(p.total)}</span>
                    {!viewerCollabId && (
                      <button
                        title="Télécharger la facture en PDF"
                        onClick={() => downloadTextAsPDF("Facture — Prestation de conciergerie", factureText(p, client), `Facture_${(client?.nom || "client").replace(/\s+/g, "_")}_${p.date}.pdf`)}
                        style={{ background: "none", border: "none", cursor: "pointer" }}
                      >
                        <Download size={13} color={C.textMuted} />
                      </button>
                    )}
                  </div>
                </div>
                {!viewerCollabId && (
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 6 }}>
                    <span style={{ fontSize: 10.5, color: p.paye ? C.green : C.amber }}>
                      {p.paye ? `Réglé le ${p.datePaiement ? new Date(p.datePaiement + "T00:00").toLocaleDateString("fr-FR") : "—"}` : "En attente de règlement"}
                    </span>
                    <button
                      onClick={() => togglePaye(p)}
                      style={{ background: "none", border: `1px solid ${C.border}`, borderRadius: 7, padding: "2px 8px", fontSize: 10.5, color: C.textMuted, cursor: "pointer" }}
                    >
                      {p.paye ? "Annuler le règlement" : "Marquer réglé"}
                    </button>
                  </div>
                )}
              </div>
            ))}
          </div>
        </Card>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------
   VUE : DONS (reçus fiscaux)
--------------------------------------------------------------- */
const emptyDon = () => ({ id: uid(), nom: "", prenom: "", adresse: "", montant: "", date: todayISO(), forme: "Numéraire", typeDonateur: "Particulier" });

function DonsView({ dons, setDons, nextNumero }) {
  const [form, setForm] = useState(emptyDon());
  const montant = Number(form.montant) || 0;
  const reduction = form.typeDonateur === "Entreprise" ? montant * 0.6 : montant * 0.66;

  function enregistrer() {
    if (!form.nom || !montant) return;
    setDons([{ ...form, numero: nextNumero("RECU") }, ...dons]);
    setForm(emptyDon());
  }

  return (
    <div className="veh-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 18 }}>
      <Card style={{ padding: 18 }}>
        <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 12, display: "flex", alignItems: "center", gap: 6 }}>
          <Heart size={15} color={C.amber} /> Nouveau don — reçu fiscal
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <div className="veh-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            <Field label="Nom du donateur"><TextInput value={form.nom} onChange={(e) => setForm({ ...form, nom: e.target.value })} /></Field>
            <Field label="Prénom"><TextInput value={form.prenom} onChange={(e) => setForm({ ...form, prenom: e.target.value })} /></Field>
          </div>
          <Field label="Adresse"><TextInput value={form.adresse} onChange={(e) => setForm({ ...form, adresse: e.target.value })} /></Field>
          <div className="veh-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10 }}>
            <Field label="Montant (€)"><TextInput type="number" value={form.montant} onChange={(e) => setForm({ ...form, montant: e.target.value })} /></Field>
            <Field label="Date"><TextInput type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} /></Field>
            <Field label="Type">
              <Select value={form.typeDonateur} onChange={(e) => setForm({ ...form, typeDonateur: e.target.value })}>
                <option>Particulier</option>
                <option>Entreprise</option>
              </Select>
            </Field>
          </div>
          <Field label="Forme du don">
            <Select value={form.forme} onChange={(e) => setForm({ ...form, forme: e.target.value })}>
              <option>Numéraire</option>
              <option>Don en nature</option>
              <option>Abandon de frais de bénévolat</option>
            </Select>
          </Field>
          {montant > 0 && (
            <div style={{ background: C.panel2, borderRadius: 9, padding: 10, fontSize: 12.5, color: C.textMuted }}>
              Réduction d'impôt estimative : <b style={{ color: C.amber }}>{eur(reduction)}</b> ({form.typeDonateur === "Entreprise" ? "60% IS, plafond 2M€" : "66% IR, plafond 20% du revenu imposable"})
            </div>
          )}
          <Btn onClick={enregistrer}><Plus size={14} /> Émettre le reçu</Btn>
        </div>
      </Card>

      <Card style={{ padding: 18 }}>
        <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 12 }}>Historique des dons</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 420, overflowY: "auto" }}>
          {dons.length === 0 && <div style={{ color: C.textMuted, fontSize: 12.5 }}>Aucun don enregistré.</div>}
          {dons.map((d) => (
            <div key={d.id} style={{ background: C.panel2, borderRadius: 9, padding: 10, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div>
                <div style={{ fontWeight: 600, fontSize: 13 }}>{d.prenom} {d.nom}</div>
                <div style={{ fontSize: 11, color: C.textMuted }}>{new Date(d.date + "T00:00").toLocaleDateString("fr-FR")} · {d.forme}</div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <div style={{ color: C.amber, fontWeight: 700 }}>{eur(Number(d.montant))}</div>
                <button
                  title="Télécharger le reçu en PDF"
                  onClick={() => downloadTextAsPDF("Reçu au titre des dons et versements", recuDonText(d), `Recu_don_${(d.nom || "donateur").replace(/\s+/g, "_")}_${d.date}.pdf`)}
                  style={{ background: "none", border: "none", cursor: "pointer" }}
                >
                  <Download size={13} color={C.textMuted} />
                </button>
              </div>
            </div>
          ))}
        </div>
      </Card>
    </div>
  );
}

/* ---------------------------------------------------------------
   VUE : BRICOLAGE SOLIDAIRE — pilier cœur de mission, distinct des
   clients conciergerie payants
--------------------------------------------------------------- */
const emptyBeneficiaire = () => ({ id: uid(), nom: "", adresse: "", telephone: "", situation: "" });
const emptyIntervention = () => ({
  id: uid(), beneficiaireId: "", date: todayISO(), type: "Plomberie", urgence: "Normale",
  description: "", gratuit: true, montant: "", materiaux: "", statut: "À faire", collaborateurId: "",
});

function MesInterventionsSolidaireView({ beneficiaires, interventions, setInterventions, viewerCollabId }) {
  const mine = interventions.filter((i) => i.collaborateurId === viewerCollabId);

  function toggleStatut(i) {
    setInterventions(interventions.map((x) => (x.id === i.id ? { ...x, statut: x.statut === "Fait" ? "À faire" : "Fait" } : x)));
  }

  return (
    <Card style={{ padding: 18 }}>
      <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 4, display: "flex", alignItems: "center", gap: 7 }}><Wrench size={16} color={C.amber} /> Mes interventions solidaires</div>
      <div style={{ fontSize: 11.5, color: C.textMuted, marginBottom: 14 }}>Vous ne voyez que les interventions qui vous sont attribuées.</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {mine.length === 0 && <div style={{ color: C.textMuted, fontSize: 12.5 }}>Aucune intervention qui vous soit attribuée pour l'instant.</div>}
        {mine.map((i) => {
          const b = beneficiaires.find((x) => x.id === i.beneficiaireId);
          return (
            <div key={i.id} style={{ background: C.panel2, border: `1px solid ${C.border}`, borderRadius: 9, padding: 12 }}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <span style={{ fontWeight: 600, fontSize: 13.5 }}>{i.type} — {b?.nom || "ménage supprimé"}</span>
                <span style={{ fontSize: 11.5, color: i.urgence === "Urgente" ? C.red : C.textMuted }}>{i.urgence}</span>
              </div>
              <div style={{ fontSize: 11.5, color: C.textMuted, marginTop: 2 }}>{b?.adresse}</div>
              <div style={{ fontSize: 12.5, marginTop: 6 }}>{i.description}</div>
              <div style={{ fontSize: 11.5, color: C.textMuted, marginTop: 4 }}>{new Date(i.date + "T00:00").toLocaleDateString("fr-FR")} · {i.gratuit ? "Gratuit" : eur(Number(i.montant) || 0)}</div>
              <Btn
                variant={i.statut === "Fait" ? "ghost" : "primary"}
                onClick={() => toggleStatut(i)}
                style={{ marginTop: 8, ...(i.statut === "Fait" ? { color: C.green, border: `1px solid ${C.green}` } : {}) }}
              >
                <CheckCircle2 size={13} /> {i.statut === "Fait" ? "Terminée" : "Marquer terminée"}

            </div>
          );
        })}

}

function SolidaireView({ beneficiaires, setBeneficiaires, interventions, setInterventions, collaborateurs }) {
  const [editingBenef, setEditingBenef] = useState(null);
  const [editingInter, setEditingInter] = useState(null);
  const [selectedBenefId, setSelectedBenefId] = useState(beneficiaires[0]?.id || null);

  function saveBenef() {
    if (!editingBenef.nom.trim()) return;
    const exists = beneficiaires.some((b) => b.id === editingBenef.id);
    setBeneficiaires(exists ? beneficiaires.map((b) => (b.id === editingBenef.id ? editingBenef : b)) : [...beneficiaires, editingBenef]);
    setSelectedBenefId(editingBenef.id);
    setEditingBenef(null);
  }
  function saveInter() {
    if (!editingInter.beneficiaireId) return;
    const exists = interventions.some((i) => i.id === editingInter.id);
    setInterventions(exists ? interventions.map((i) => (i.id === editingInter.id ? editingInter : i)) : [editingInter, ...interventions]);
    setEditingInter(null);
  }

  const selected = beneficiaires.find((b) => b.id === selectedBenefId);
  const mine = interventions.filter((i) => i.beneficiaireId === selectedBenefId);

  return (
    <div className="veh-grid" style={{ display: "grid", gridTemplateColumns: "300px 1fr", gap: 18 }}>
      <Card style={{ padding: 14 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <div style={{ fontWeight: 700, fontSize: 14, display: "flex", alignItems: "center", gap: 6 }}><Wrench size={15} color={C.amber} /> Ménages aidés</div>
          <Btn onClick={() => setEditingBenef(emptyBeneficiaire())}><Plus size={14} /></Btn>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {beneficiaires.map((b) => (
            <button key={b.id} onClick={() => setSelectedBenefId(b.id)} style={{
              textAlign: "left", padding: 10, borderRadius: 9, cursor: "pointer",
              background: selectedBenefId === b.id ? "rgba(232,163,61,0.14)" : "transparent",
              border: `1px solid ${selectedBenefId === b.id ? C.amber : C.border}`,
            }}>
              <div style={{ fontWeight: 600, fontSize: 13.5 }}>{b.nom || "Sans nom"}</div>
              <div style={{ fontSize: 11, color: C.textMuted }}>{b.adresse || "Adresse non renseignée"}</div>
            </button>
          ))}
          {beneficiaires.length === 0 && <div style={{ color: C.textMuted, fontSize: 12.5 }}>Aucun ménage enregistré.</div>}
        </div>
      </Card>

      <Card style={{ padding: 18 }}>
        {editingBenef ? (
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <div style={{ fontWeight: 700, fontSize: 15 }}>{beneficiaires.some((b) => b.id === editingBenef.id) ? "Modifier le ménage" : "Nouveau ménage aidé"}</div>
            <Field label="Nom du foyer"><TextInput value={editingBenef.nom} onChange={(e) => setEditingBenef({ ...editingBenef, nom: e.target.value })} /></Field>
            <Field label="Adresse"><TextInput value={editingBenef.adresse} onChange={(e) => setEditingBenef({ ...editingBenef, adresse: e.target.value })} /></Field>
            <Field label="Téléphone"><TextInput value={editingBenef.telephone} onChange={(e) => setEditingBenef({ ...editingBenef, telephone: e.target.value })} /></Field>
            <Field label="Situation / contexte (pour mémoire interne)"><TextInput value={editingBenef.situation} onChange={(e) => setEditingBenef({ ...editingBenef, situation: e.target.value })} /></Field>
            <div style={{ display: "flex", gap: 8 }}>
              <Btn onClick={saveBenef}><Check size={14} /> Enregistrer</Btn>
              <Btn variant="ghost" onClick={() => setEditingBenef(null)}>Annuler</Btn>
            </div>
          </div>
        ) : editingInter ? (
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <div style={{ fontWeight: 700, fontSize: 15 }}>Intervention solidaire — {selected?.nom}</div>
            <div className="veh-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
              <Field label="Date"><TextInput type="date" value={editingInter.date} onChange={(e) => setEditingInter({ ...editingInter, date: e.target.value })} /></Field>
              <Field label="Type">
                <Select value={editingInter.type} onChange={(e) => setEditingInter({ ...editingInter, type: e.target.value })}>
                  <option>Plomberie</option><option>Chauffage</option><option>Électricité</option><option>Petit bricolage</option><option>Autre</option>
                </Select>
              </Field>
            </div>
            <div className="veh-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
              <Field label="Urgence">
                <Select value={editingInter.urgence} onChange={(e) => setEditingInter({ ...editingInter, urgence: e.target.value })}>
                  <option>Normale</option><option>Urgente</option>
                </Select>
              </Field>
              <Field label="Collaborateur assigné">
                <Select value={editingInter.collaborateurId} onChange={(e) => setEditingInter({ ...editingInter, collaborateurId: e.target.value })}>
                  <option value="">— non assigné —</option>
                  {collaborateurs.map((c) => <option key={c.id} value={c.id}>{c.nom}</option>)}
                </Select>
              </Field>
            </div>
            <Field label="Description du problème"><TextInput value={editingInter.description} onChange={(e) => setEditingInter({ ...editingInter, description: e.target.value })} /></Field>
            <Field label="Prise en charge">
              <ToggleYesNo value={editingInter.gratuit} onChange={(v) => setEditingInter({ ...editingInter, gratuit: v })} />
            </Field>
            {!editingInter.gratuit && (
              <Field label="Montant à prix réduit (€)"><TextInput type="number" value={editingInter.montant} onChange={(e) => setEditingInter({ ...editingInter, montant: e.target.value })} /></Field>
            )}
            <Field label="Matériaux utilisés"><TextInput value={editingInter.materiaux} onChange={(e) => setEditingInter({ ...editingInter, materiaux: e.target.value })} placeholder="Ex. 2m tuyau PER, 1 joint..." /></Field>
            <Field label="Statut">
              <Select value={editingInter.statut} onChange={(e) => setEditingInter({ ...editingInter, statut: e.target.value })}>
                <option>À faire</option><option>Fait</option>
              </Select>
            </Field>
            <div style={{ display: "flex", gap: 8 }}>
              <Btn onClick={saveInter}><Check size={14} /> Enregistrer</Btn>
              <Btn variant="ghost" onClick={() => setEditingInter(null)}>Annuler</Btn>
            </div>
          </div>
        ) : selected ? (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14 }}>
              <div>
                <div style={{ fontWeight: 700, fontSize: 17 }}>{selected.nom}</div>
                <div style={{ color: C.textMuted, fontSize: 13 }}>{selected.adresse}</div>
                {selected.situation && <div style={{ color: C.textMuted, fontSize: 11.5, marginTop: 4 }}>{selected.situation}</div>}
              </div>
              <div style={{ display: "flex", gap: 6 }}>
                <Btn variant="ghost" onClick={() => setEditingBenef(selected)}>Modifier</Btn>
                <ConfirmDelete onConfirm={() => { setBeneficiaires(beneficiaires.filter((b) => b.id !== selected.id)); setSelectedBenefId(null); }} />
              </div>
            </div>
            <Btn onClick={() => setEditingInter({ ...emptyIntervention(), beneficiaireId: selected.id })}><Plus size={14} /> Nouvelle intervention</Btn>
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 14 }}>
              {mine.length === 0 && <div style={{ color: C.textMuted, fontSize: 12.5 }}>Aucune intervention enregistrée.</div>}
              {mine.map((i) => (
                <div key={i.id} onClick={() => setEditingInter(i)} style={{ background: C.panel2, border: `1px solid ${C.border}`, borderRadius: 9, padding: 10, cursor: "pointer" }}>
                  <div style={{ display: "flex", justifyContent: "space-between" }}>
                    <span style={{ fontWeight: 600, fontSize: 13 }}>{i.type} · {new Date(i.date + "T00:00").toLocaleDateString("fr-FR")}</span>
                    <span style={{ fontSize: 11.5, color: i.statut === "Fait" ? C.green : C.amber }}>{i.statut}</span>
                  </div>
                  <div style={{ fontSize: 11.5, color: C.textMuted, marginTop: 2 }}>{i.description}{i.urgence === "Urgente" ? " · Urgent" : ""}{!i.gratuit && i.montant ? ` · ${eur(Number(i.montant))}` : " · Gratuit"}</div>
                </div>
              ))}
            </div>
          </div>
        ) : (
          <div style={{ color: C.textMuted, textAlign: "center", padding: 40 }}>Sélectionnez un ménage ou ajoutez-en un nouveau.</div>
        )}
      </Card>
    </div>
  );
}

/* ---------------------------------------------------------------
   VUE : MATÉRIAUX — collecte et redistribution
--------------------------------------------------------------- */
const emptyMateriau = () => ({ id: uid(), type: "", quantite: "", valeur: "", donateur: "", dateReception: todayISO(), statut: "En stock", beneficiaireId: "", dateRedistribution: "" });

function MateriauxView({ materiaux, setMateriaux, beneficiaires }) {
  const [editing, setEditing] = useState(null);

  function save() {
    if (!editing.type.trim()) return;
    const exists = materiaux.some((m) => m.id === editing.id);
    setMateriaux(exists ? materiaux.map((m) => (m.id === editing.id ? editing : m)) : [editing, ...materiaux]);
    setEditing(null);
  }
  function redistribuer(m, beneficiaireId) {
    setMateriaux(materiaux.map((x) => (x.id === m.id ? { ...x, statut: "Redistribué", beneficiaireId, dateRedistribution: todayISO() } : x)));
  }

  const enStock = materiaux.filter((m) => m.statut === "En stock");
  const redistribues = materiaux.filter((m) => m.statut === "Redistribué");

  return (
    <div className="veh-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 18 }}>
      <Card style={{ padding: 18 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <div style={{ fontWeight: 700, fontSize: 15, display: "flex", alignItems: "center", gap: 7 }}><Package size={16} color={C.amber} /> En stock ({enStock.length})</div>
          <Btn onClick={() => setEditing(emptyMateriau())}><Plus size={14} /> Réception</Btn>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 480, overflowY: "auto" }}>
          {enStock.length === 0 && <div style={{ color: C.textMuted, fontSize: 12.5 }}>Aucun matériau en stock.</div>}
          {enStock.map((m) => (
            <div key={m.id} style={{ background: C.panel2, border: `1px solid ${C.border}`, borderRadius: 9, padding: 10 }}>
              <div style={{ fontWeight: 600, fontSize: 13 }}>{m.type} {m.quantite ? `— ${m.quantite}` : ""}{m.valeur ? ` (${eur(Number(m.valeur))})` : ""}</div>
              <div style={{ fontSize: 11, color: C.textMuted, marginBottom: 8 }}>Don de {m.donateur || "anonyme"} · reçu le {new Date(m.dateReception + "T00:00").toLocaleDateString("fr-FR")}</div>
              <Select onChange={(e) => e.target.value && redistribuer(m, e.target.value)} value="">
                <option value="">Redistribuer à…</option>
                {beneficiaires.map((b) => <option key={b.id} value={b.id}>{b.nom}</option>)}
              </Select>
            </div>
          ))}
        </div>
      </Card>

      <Card style={{ padding: 18 }}>
        {editing ? (
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <div style={{ fontWeight: 700, fontSize: 15 }}>Nouvelle réception de matériau</div>
            <Field label="Type de matériau"><TextInput value={editing.type} onChange={(e) => setEditing({ ...editing, type: e.target.value })} placeholder="Ex. Carrelage, peinture, câble électrique..." /></Field>

            <Field label="Valeur estimée (€)"><TextInput type="number" value={editing.valeur} onChange={(e) => setEditing({ ...editing, valeur: e.target.value })} placeholder="Pour le reçu fiscal et le suivi" /></Field>

/* ---------------------------------------------------------------
   CARTE D'ADHÉRENT — planche A4 portant le recto et le verso au
   format carte bancaire (85,6 × 54 mm), avec repères de découpe.
   Une page à ce format s'imprime sans mise à l'échelle, là où un
   PDF de la taille d'une carte est presque toujours redimensionné
   par le pilote d'impression.
--------------------------------------------------------------- */
function cartePDF(adherent) {
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "mm", format: "a4" });
    const CW = 85.6, CH = 54;      // format ISO d'une carte
    const x = (210 - CW) / 2;

    const navy = [11, 18, 32];
    const ambre = [232, 163, 61];
    const annee = new Date(adherent.dateAdhesion + "T00:00").getFullYear() || new Date().getFullYear();

    function reperes(y) {
      doc.setDrawColor(170);
      doc.setLineWidth(0.1);
      [[x, y], [x + CW, y], [x, y + CH], [x + CW, y + CH]].forEach(([px, py]) => {
        doc.line(px - 4, py, px - 1, py);
        doc.line(px + 1, py, px + 4, py);
        doc.line(px, py - 4, px, py - 1);
        doc.line(px, py + 1, px, py + 4);
      });
    }

    /* ---------- recto ---------- */
    let y = 30;
    doc.setFillColor(...navy);
    doc.rect(x, y, CW, CH, "F");
    doc.setFillColor(...ambre);
    doc.rect(x, y, CW, 1.6, "F");

    doc.setTextColor(255);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(11);
    doc.text("Vosges Entraide Habitat", x + 6, y + 11);

    doc.setFont("helvetica", "normal");
    doc.setFontSize(6.4);
    doc.setTextColor(160, 172, 195);
    doc.text("Conciergerie . Bricolage solidaire . Insertion", x + 6, y + 15.6);

    doc.setTextColor(...ambre);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(7.2);
    doc.text("CARTE D'ADHERENT", x + 6, y + 25);

    doc.setTextColor(255);
    doc.setFontSize(13);
    doc.text(pdfSafe(`${adherent.prenom || ""} ${(adherent.nom || "").toUpperCase()}`.trim()), x + 6, y + 33);

    doc.setFont("helvetica", "normal");
    doc.setFontSize(6.6);
    doc.setTextColor(160, 172, 195);
    doc.text("N° ADHERENT", x + 6, y + 41);
    doc.text("MEMBRE", x + 44, y + 41);

    doc.setFont("helvetica", "bold");
    doc.setFontSize(11);
    doc.setTextColor(...ambre);
    doc.text(adherent.numero || "—", x + 6, y + 47);
    doc.setTextColor(255);
    doc.text(String(annee), x + 44, y + 47);
    reperes(y);

    /* ---------- verso ---------- */
    y = 105;
    doc.setDrawColor(...navy);
    doc.setLineWidth(0.4);
    doc.rect(x, y, CW, CH);
    doc.setFillColor(...ambre);
    doc.rect(x, y + CH - 1.6, CW, 1.6, "F");

    doc.setTextColor(...navy);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(7);
    doc.text("Association loi 1901", x + 6, y + 9);

    doc.setFont("helvetica", "normal");
    doc.setFontSize(6.4);
    doc.setTextColor(70);
    [
      "32, rue Denfert-Rochereau",
      "88110 Raon-l'Etape",
      "",
      `Adhesion du ${new Date(adherent.dateAdhesion + "T00:00").toLocaleDateString("fr-FR")}`,
      `Valable jusqu'au 31 decembre ${annee}`,
      "",
      "Cette carte atteste de la qualite de membre.",
      "Elle n'ouvre droit a aucune reduction sur les",
      "prestations de l'association.",
    ].forEach((l, i) => { if (l) doc.text(pdfSafe(l), x + 6, y + 15 + i * 3.6); });

    doc.setFontSize(5.6);
    doc.setTextColor(120);
    doc.text("En cas de perte, prevenir l'association.", x + 6, y + CH - 5);
    reperes(y);

    /* ---------- consigne d'impression ---------- */
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    doc.setTextColor(110);
    doc.text(pdfSafe("Imprimer à 100 %, sans « ajuster à la page ». Découper suivant les repères, "
      + "puis coller dos à dos ou plastifier."), 20, 175, { maxWidth: 170 });

    doc.save(`Carte_adherent_${(adherent.numero || "sans-numero")}_${(adherent.nom || "").replace(/\s+/g, "_")}.pdf`);
    return true;
  } catch (e) {
    return false;
  }
}

function AdherentsView({ adherents, setAdherents, nextNumero }) {
  const [editing, setEditing] = useState(null);

  function save() {
    if (!editing.nom.trim()) return;
    const exists = adherents.some((a) => a.id === editing.id);
    if (exists) {
      setAdherents(adherents.map((a) => (a.id === editing.id ? editing : a)));
    } else {
      // Le numéro est attribué à la création et ne change plus : c'est lui qui
      // figure sur la carte remise à l'adhérent.
      setAdherents([{ ...editing, numero: nextNumero("ADH") }, ...adherents]);
    }
    setEditing(null);
  }

  const q = recherche.trim().toLowerCase();
  const listeFiltree = !q ? adherents : adherents.filter((a) =>
    [a.numero, a.prenom, a.nom, a.telephone, a.adresse]
      .filter(Boolean).join(" ").toLowerCase().includes(q));

  return (
    <div className="veh-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 18 }}>
      <Card style={{ padding: 18 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>

          <Btn onClick={() => setEditing(emptyAdherent())}><Plus size={14} /> Nouvel adhérent</Btn>
        </div>
        <TextInput
          value={recherche}
          onChange={(e) => setRecherche(e.target.value)}
          placeholder="Rechercher : numéro de carte, nom, téléphone…"
          style={{ width: "100%", marginBottom: 10 }}
        />
        {q && (
          <div style={{ fontSize: 11, color: C.textMuted, marginBottom: 8 }}>
            {listeFiltree.length} résultat{listeFiltree.length > 1 ? "s" : ""} sur {adherents.length}
          </div>
        )}
        <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 460, overflowY: "auto" }}>
          {adherents.length === 0 && <div style={{ color: C.textMuted, fontSize: 12.5 }}>Aucun adhérent enregistré.</div>}
          {adherents.length > 0 && listeFiltree.length === 0 && <div style={{ color: C.textMuted, fontSize: 12.5 }}>Aucun adhérent ne correspond à cette recherche.</div>}
          {listeFiltree.map((a) => (
            <div key={a.id} style={{ background: C.panel2, border: `1px solid ${C.border}`, borderRadius: 9, padding: 10, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
              <div style={{ minWidth: 0 }}>
                <div style={{ fontWeight: 600, fontSize: 13, display: "flex", alignItems: "center", gap: 7, flexWrap: "wrap" }}>
                  {a.prenom} {a.nom}
                  {a.numero && (
                    <span style={{ fontSize: 10.5, fontWeight: 600, color: C.amber, background: "rgba(232,163,61,0.12)", border: `1px solid ${C.amber}`, borderRadius: 20, padding: "1px 8px" }}>{a.numero}</span>
                  )}
                </div>
                <div style={{ fontSize: 11, color: C.textMuted }}>Adhésion le {new Date(a.dateAdhesion + "T00:00").toLocaleDateString("fr-FR")}{a.tarifReduit ? " · tarif réduit" : ""}{a.cotisationPayee && a.datePaiement ? ` · encaissée le ${new Date(a.datePaiement + "T00:00").toLocaleDateString("fr-FR")}` : ""}</div>
              </div>
              <div style={{ display: "flex", gap: 6, alignItems: "center", flexShrink: 0 }}>
                <span style={{ fontSize: 11, color: a.cotisationPayee ? C.green : C.amber }}>{a.cotisationPayee ? "Payée" : "À encaisser"} · {eur(Number(a.montant) || 0)}</span>
                <Btn
                  variant="ghost"
                  disabled={!a.numero}
                  onClick={() => a.numero && cartePDF(a)}
                  title={a.numero ? "Imprimer la carte d'adhérent" : "Cet adhérent n'a pas de numéro : rouvrez sa fiche et enregistrez-la pour lui en attribuer un."}
                >
                  <IdCard size={13} /> Carte
                </Btn>

              </div>

      </Card>

      <Card style={{ padding: 18 }}>
        {editing ? (

            <Field label="Cotisation payée">
              <ToggleYesNo
                value={editing.cotisationPayee}
                onChange={(v) => setEditing({ ...editing, cotisationPayee: v, datePaiement: v ? (editing.datePaiement || todayISO()) : "" })}
              />
            </Field>
            {editing.cotisationPayee && (
              <Field label="Date d'encaissement (c'est elle qui détermine le mois au bilan)">
                <TextInput type="date" value={editing.datePaiement || ""} onChange={(e) => setEditing({ ...editing, datePaiement: e.target.value })} />
              </Field>
            )}
            <div style={{ display: "flex", gap: 8 }}>
              <Btn onClick={save}><Check size={14} /> Enregistrer</Btn>
              <Btn variant="ghost" onClick={() => setEditing(null)}>Annuler</Btn>
            </div>
          </div>
        ) : (
          <div style={{ color: C.textMuted, textAlign: "center", padding: 40 }}>Sélectionnez « Modifier » ou ajoutez un adhérent.</div>
        )}
      </Card>
    </div>
  );
}

function InsertionView({ parcours, setParcours }) {
  const [editing, setEditing] = useState(null);
  const [ajoutHeures, setAjoutHeures] = useState({});

  function save() {
    if (!editing.nom.trim()) return;
    const exists = parcours.some((p) => p.id === editing.id);
    setParcours(exists ? parcours.map((p) => (p.id === editing.id ? editing : p)) : [editing, ...parcours]);
    setEditing(null);
  }
  function ajouterHeures(p) {
    const n = Number(ajoutHeures[p.id]) || 0;
    if (n <= 0) return;
    setParcours(parcours.map((x) => (x.id === p.id ? { ...x, heures: String((Number(x.heures) || 0) + n) } : x)));
    setAjoutHeures({ ...ajoutHeures, [p.id]: "" });
  }

  const totalHeures = parcours.reduce((s, p) => s + (Number(p.heures) || 0), 0);
  const enCours = parcours.filter((p) => p.statut === "En cours").length;

  return (
    <div>

        <Card style={{ padding: 16 }}>
          <div style={{ fontSize: 12, color: C.textMuted }}>Parcours en cours</div>
          <div style={{ fontWeight: 700, fontSize: 24, color: C.amber }}>{enCours}</div>

        <Card style={{ padding: 16 }}>
          <div style={{ fontSize: 12, color: C.textMuted }}>Total heures d'activité cumulées</div>

        </Card>

      <div className="veh-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 18 }}>
        <Card style={{ padding: 18 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <div style={{ fontWeight: 700, fontSize: 15, display: "flex", alignItems: "center", gap: 7 }}><TrendingUp size={16} color={C.amber} /> Parcours d'insertion</div>
            <Btn onClick={() => setEditing(emptyParcours())}><Plus size={14} /> Nouveau</Btn>
          </div>

              <div key={p.id} style={{ background: C.panel2, border: `1px solid ${C.border}`, borderRadius: 9, padding: 10 }}>
                <div style={{ display: "flex", justifyContent: "space-between" }}>
                  <span style={{ fontWeight: 600, fontSize: 13 }}>{p.nom}</span>
                  <span style={{ fontSize: 11.5, color: p.statut === "En cours" ? C.amber : C.green }}>{p.statut}</span>
                </div>
                <div style={{ fontSize: 11.5, color: C.textMuted, marginBottom: 6 }}>{p.activite} · depuis le {new Date(p.dateDebut + "T00:00").toLocaleDateString("fr-FR")} · {p.heures || 0} h cumulées</div>
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                  <TextInput type="number" value={ajoutHeures[p.id] || ""} onChange={(e) => setAjoutHeures({ ...ajoutHeures, [p.id]: e.target.value })} placeholder="+ heures" style={{ width: 90, padding: "5px 8px", fontSize: 12 }} />
                  <Btn variant="ghost" onClick={() => ajouterHeures(p)}>Ajouter</Btn>
                  <Btn variant="ghost" onClick={() => setEditing(p)}>Modifier</Btn>
                </div>
              </div>
            ))}
          </div>
        </Card>

        <Card style={{ padding: 18 }}>
          {editing ? (
            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>

                  <option>En cours</option><option>Terminé</option>

function TravauxView({ travaux, setTravaux, nextNumero }) {

    if (!editing.client.trim()) return;
    const exists = travaux.some((t) => t.id === editing.id);
    if (exists) {
      setTravaux(travaux.map((t) => (t.id === editing.id ? editing : t)));
    } else {
      const withNumero = { ...editing, numero: nextNumero("TRX") };
      setTravaux([withNumero, ...travaux]);
      setEditing(withNumero);
      return;
    }
    setEditing(null);
  }
  function addFourniture() {
    setEditing({ ...editing, fournitures: [...(editing.fournitures || []), { id: uid(), designation: "", montant: "" }] });
  }
  function updateFourniture(fid, field, value) {
    setEditing({ ...editing, fournitures: editing.fournitures.map((f) => (f.id === fid ? { ...f, [field]: value } : f)) });
  }
  function removeFourniture(fid) {
    setEditing({ ...editing, fournitures: editing.fournitures.filter((f) => f.id !== fid) });
  }

  function totalFor(t) {
    const mo = (Number(t.heures) || 0) * (Number(t.tauxHoraire) || 0);

    <div className="veh-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 18 }}>

              </div>
              <div style={{ fontSize: 11, color: C.textMuted, marginTop: 2, display: "flex", alignItems: "center", gap: 6 }}>
                <span>{new Date(t.date + "T00:00").toLocaleDateString("fr-FR")}{t.adresse ? " · " + t.adresse : ""}</span>
                <span style={{
                  fontSize: 10, fontWeight: 600, borderRadius: 10, padding: "1px 7px",
                  color: t.statut === "Facturé" ? C.green : C.amber,
                  background: t.statut === "Facturé" ? "rgba(74,222,128,0.12)" : "rgba(232,163,61,0.12)",

/* ---------------------------------------------------------------
   VUE : ÉCHÉANCES — rappels visibles à l'ouverture (pas de push :
   voir explication donnée dans le chat)
--------------------------------------------------------------- */
function EcheancesView({ clients, adherents }) {
  // Borne basse indispensable : sans elle, une échéance dépassée depuis des
  // années satisfait toujours « dans moins de n jours » et ne quitte plus la liste.
  const dansNJours = (dateStr, n) => {
    const d = new Date(dateStr + "T00:00");
    const diff = (d - new Date(todayISO() + "T00:00")) / 86400000;
    return diff >= 0 && diff <= n;
  };

  const contratsAEcheance = clients.filter((c) => {
    if (c.contratStatut !== "Signé" || !c.contratDate) return false;
    const f = FORMULES.find((x) => x.id === c.formule) || FORMULES[0];
    const ans = f.ans || 1;
    const echeance = new Date(c.contratDate + "T00:00");
    echeance.setFullYear(echeance.getFullYear() + ans);
    return dansNJours(echeance.toISOString().slice(0, 10), 60);
  }).map((c) => {
    const f = FORMULES.find((x) => x.id === c.formule) || FORMULES[0];
    const ans = f.ans || 1;
    const echeance = new Date(c.contratDate + "T00:00");
    echeance.setFullYear(echeance.getFullYear() + ans);
    return { ...c, echeance: echeance.toISOString().slice(0, 10) };
  });

  const adherentsAEcheance = adherents.filter((a) => {
    const echeance = new Date(a.dateAdhesion + "T00:00");
    echeance.setFullYear(echeance.getFullYear() + 1);
    return dansNJours(echeance.toISOString().slice(0, 10), 30);
  }).map((a) => {
    const echeance = new Date(a.dateAdhesion + "T00:00");
    echeance.setFullYear(echeance.getFullYear() + 1);
    return { ...a, echeance: echeance.toISOString().slice(0, 10) };
  });

  return (
    <div>
      <div style={{ fontSize: 11.5, color: C.textMuted, background: C.panel2, border: `1px solid ${C.border}`, borderRadius: 9, padding: 10, marginBottom: 16 }}>
        Ces rappels s'affichent quand vous ouvrez cet onglet — l'application ne peut pas vous envoyer de notification automatique sans que vous l'ayez ouverte (voir mon explication dans le chat).
      </div>
      <div className="veh-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 18 }}>
        <Card style={{ padding: 18 }}>
          <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 12, display: "flex", alignItems: "center", gap: 7 }}><Bell size={15} color={C.amber} /> Contrats arrivant à échéance (60 j)</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {contratsAEcheance.length === 0 && <div style={{ color: C.textMuted, fontSize: 12.5 }}>Aucune échéance de contrat prochaine.</div>}
            {contratsAEcheance.map((c) => (
              <div key={c.id} style={{ background: C.panel2, borderRadius: 8, padding: 10, fontSize: 12.5 }}>
                <div style={{ fontWeight: 600 }}>{c.nom}</div>
                <div style={{ color: C.textMuted }}>Échéance le {new Date(c.echeance + "T00:00").toLocaleDateString("fr-FR")}</div>
              </div>
            ))}
          </div>
        </Card>
        <Card style={{ padding: 18 }}>
          <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 12, display: "flex", alignItems: "center", gap: 7 }}><Bell size={15} color={C.amber} /> Cotisations à renouveler (30 j)</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {adherentsAEcheance.length === 0 && <div style={{ color: C.textMuted, fontSize: 12.5 }}>Aucune cotisation à renouveler prochainement.</div>}
            {adherentsAEcheance.map((a) => (
              <div key={a.id} style={{ background: C.panel2, borderRadius: 8, padding: 10, fontSize: 12.5 }}>
                <div style={{ fontWeight: 600 }}>{a.prenom} {a.nom}</div>
                <div style={{ color: C.textMuted }}>Échéance le {new Date(a.echeance + "T00:00").toLocaleDateString("fr-FR")}</div>
              </div>
            ))}
          </div>
        </Card>
      </div>
    </div>
  );
}

function DepensesView({ depenses, setDepenses, prestataires, nextNumero }) {
  const [editing, setEditing] = useState(null);

  function save() {
    if (!editing.montant) return;
    const exists = depenses.some((d) => d.id === editing.id);
    if (exists) {
      setDepenses(depenses.map((d) => (d.id === editing.id ? editing : d)));
    } else {
      setDepenses([{ ...editing, numero: nextNumero("DEP") }, ...depenses]);
    }
    setEditing(null);
  }
  function valider(d) {
    // Une note de frais soumise par un collaborateur n'a pas encore de numéro :
    // il lui en faut un à la validation, comme à toute dépense enregistrée.
    setDepenses(depenses.map((x) => (x.id === d.id ? { ...x, valide: true, numero: x.numero || nextNumero("DEP") } : x)));
  }
  function rejeter(d) {
    setDepenses(depenses.filter((x) => x.id !== d.id));
  }

  const enAttente = depenses.filter((d) => d.valide === false);
  const validees = depenses.filter((d) => d.valide !== false);
  const totalDeductible = validees.filter((d) => d.deductible).reduce((s, d) => s + (Number(d.montant) || 0), 0);
  const totalNonDeductible = validees.filter((d) => !d.deductible).reduce((s, d) => s + (Number(d.montant) || 0), 0);

  return (
    <div>
      {enAttente.length > 0 && (
        <Card style={{ padding: 16, marginBottom: 18, border: `1px solid ${C.amber}` }}>
          <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 10, color: C.amber, display: "flex", alignItems: "center", gap: 7 }}>
            <AlertTriangle size={15} /> En attente de validation ({enAttente.length})
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {enAttente.map((d) => (
              <div key={d.id} style={{ background: C.panel2, borderRadius: 9, padding: 10 }}>
                <div style={{ display: "flex", justifyContent: "space-between" }}>
                  <span style={{ fontWeight: 600, fontSize: 13 }}>{d.fournisseur || "—"} · {eur(Number(d.montant) || 0)}</span>
                  <span style={{ fontSize: 11, color: C.textMuted }}>déclaré par {d.soumisPar}</span>
                </div>
                <div style={{ fontSize: 11.5, color: C.textMuted, marginTop: 2 }}>{d.type} · {new Date(d.date + "T00:00").toLocaleDateString("fr-FR")}{d.description ? " · " + d.description : ""}</div>
                <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
                  <Btn onClick={() => valider(d)}><Check size={13} /> Valider</Btn>
                  <Btn variant="danger" onClick={() => rejeter(d)}>Rejeter</Btn>
                </div>
              </div>
            ))}
          </div>
        </Card>
      )}
      <div className="veh-grid" style={{ display: "grid", gridTemplateColumns: "repeat(2,1fr)", gap: 14, marginBottom: 18 }}>
        <Card style={{ padding: 16 }}>
          <div style={{ fontSize: 12, color: C.textMuted }}>Total déductible (validé)</div>
          <div style={{ fontWeight: 700, fontSize: 22, color: C.amber }}>{eur(totalDeductible)}</div>
        </Card>
        <Card style={{ padding: 16 }}>
          <div style={{ fontSize: 12, color: C.textMuted }}>Total non déductible (validé)</div>
          <div style={{ fontWeight: 700, fontSize: 22, color: C.textMuted }}>{eur(totalNonDeductible)}</div>
        </Card>
      </div>
      <div className="veh-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 18 }}>
        <Card style={{ padding: 18 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <div style={{ fontWeight: 700, fontSize: 15, display: "flex", alignItems: "center", gap: 7 }}><TrendingDown size={16} color={C.amber} /> Dépenses validées</div>
            <Btn onClick={() => setEditing(emptyDepense())}><Plus size={14} /> Nouvelle dépense</Btn>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 480, overflowY: "auto" }}>
            {validees.length === 0 && <div style={{ color: C.textMuted, fontSize: 12.5 }}>Aucune dépense enregistrée.</div>}
            {validees.map((d) => (
              <div key={d.id} onClick={() => setEditing(d)} style={{ background: C.panel2, border: `1px solid ${C.border}`, borderRadius: 9, padding: 10, cursor: "pointer" }}>
