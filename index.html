                  <span style={{ fontWeight: 600, fontSize: 13 }}>{d.numero ? `${d.numero} · ` : ""}{d.fournisseur || prestataires.find((p) => p.id === d.prestataireId)?.nom || "—"}</span>
                  <span style={{ fontWeight: 700, fontSize: 13, color: C.text }}>{eur(Number(d.montant) || 0)}</span>
                </div>
                <div style={{ fontSize: 11, color: C.textMuted, marginTop: 2, display: "flex", gap: 6, alignItems: "center" }}>
                  <span>{d.type} · {new Date(d.date + "T00:00").toLocaleDateString("fr-FR")}</span>
                  {!d.deductible && <span style={{ fontSize: 10, color: C.textMuted, border: `1px solid ${C.border}`, borderRadius: 8, padding: "0 6px" }}>non déductible</span>}
                </div>
              </div>
            ))}
          </div>
        </Card>
        <Card style={{ padding: 18 }}>
          {!editing ? (
            <div style={{ color: C.textMuted, textAlign: "center", padding: 40 }}>Sélectionnez une dépense ou créez-en une nouvelle.</div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              <div style={{ fontWeight: 700, fontSize: 15 }}>{editing.numero ? `${editing.numero} — Modifier` : "Nouvelle dépense"}</div>
              <Field label="Prestataire enregistré (optionnel)">
                <Select value={editing.prestataireId} onChange={(e) => setEditing({ ...editing, prestataireId: e.target.value, fournisseur: e.target.value ? "" : editing.fournisseur })}>
                  <option value="">— aucun / autre —</option>
                  {prestataires.map((p) => <option key={p.id} value={p.id}>{p.nom}</option>)}
                </Select>
              </Field>
              {!editing.prestataireId && (
                <Field label="Fournisseur / bénéficiaire"><TextInput value={editing.fournisseur} onChange={(e) => setEditing({ ...editing, fournisseur: e.target.value })} placeholder="Nom si non enregistré ci-dessus" /></Field>
              )}
              <div className="veh-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <Field label="Type">
                  <Select value={editing.type} onChange={(e) => setEditing({ ...editing, type: e.target.value })}>
                    <option>Facture reçue</option><option>Note de frais</option>
                  </Select>
                </Field>
                <Field label="Date"><TextInput type="date" value={editing.date} onChange={(e) => setEditing({ ...editing, date: e.target.value })} /></Field>
              </div>
              <Field label="Description"><TextInput value={editing.description} onChange={(e) => setEditing({ ...editing, description: e.target.value })} /></Field>
              <Field label="Montant (€)"><TextInput type="number" value={editing.montant} onChange={(e) => setEditing({ ...editing, montant: e.target.value })} /></Field>
              <Field label="Déductible"><ToggleYesNo value={editing.deductible} onChange={(v) => setEditing({ ...editing, deductible: v })} /></Field>
              <div style={{ display: "flex", gap: 8 }}>
                <Btn onClick={save}><Check size={14} /> Enregistrer</Btn>
                <Btn variant="ghost" onClick={() => setEditing(null)}>Annuler</Btn>
                {depenses.some((d) => d.id === editing.id) && <ConfirmDelete onConfirm={() => { setDepenses(depenses.filter((d) => d.id !== editing.id)); setEditing(null); }} />}
              </div>
            </div>
          )}
        </Card>
      </div>
    </div>
  );
}

function BilanView({ dons, passages, travaux, depenses, interventions, adherents }) {
  const mois = (dateStr) => (dateStr || "").slice(0, 7); // "YYYY-MM"
  const travauxFactures = travaux.filter((t) => t.statut === "Facturé");
  const interventionsPayantes = (interventions || []).filter((i) => !i.gratuit && Number(i.montant) > 0);
  const cotisationsPayees = (adherents || []).filter((a) => a.cotisationPayee);
  // Une cotisation compte dans le mois où elle est encaissée, pas dans celui de
  // l'adhésion : les deux peuvent être séparés de plusieurs mois, voire d'années.
  const moisCotisation = (a) => mois(a.datePaiement || a.dateAdhesion);

  const moisSet = new Set([
    ...dons.map((d) => mois(d.date)),
    ...passages.map((p) => mois(p.date)),
    ...travauxFactures.map((t) => mois(t.date)),
    ...(depenses || []).map((d) => mois(d.date)),
    ...interventionsPayantes.map((i) => mois(i.date)),
    ...cotisationsPayees.map(moisCotisation),
  ].filter(Boolean));
  const moisTries = Array.from(moisSet).sort().reverse();

  function libelleMois(m) {
    const [y, mm] = m.split("-");
    return new Date(Number(y), Number(mm) - 1, 1).toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
  }

  const lignes = moisTries.map((m) => {
    const donsMois = dons.filter((d) => mois(d.date) === m);
    const passagesMois = passages.filter((p) => mois(p.date) === m);
    const travauxMois = travauxFactures.filter((t) => mois(t.date) === m);
    const depensesMois = (depenses || []).filter((d) => mois(d.date) === m && d.valide !== false);
    const interventionsMois = interventionsPayantes.filter((i) => mois(i.date) === m);
    const cotisationsMois = cotisationsPayees.filter((a) => moisCotisation(a) === m);

    const totalDons = donsMois.reduce((s, d) => s + (Number(d.montant) || 0), 0);
    const totalConciergerie = passagesMois.reduce((s, p) => s + (Number(p.total) || 0), 0);
    const totalTravauxMO = travauxMois.reduce((s, t) => s + (Number(t.heures) || 0) * (Number(t.tauxHoraire) || 0), 0);
    const totalTravauxFournitures = travauxMois.reduce((s, t) => s + (t.fournitures || []).reduce((s2, f) => s2 + (Number(f.montant) || 0), 0), 0);
    const totalSolidairePayant = interventionsMois.reduce((s, i) => s + (Number(i.montant) || 0), 0);
    const totalCotisations = cotisationsMois.reduce((s, a) => s + (Number(a.montant) || 0), 0);
    const totalRecettes = totalDons + totalConciergerie + totalTravauxMO + totalTravauxFournitures + totalSolidairePayant + totalCotisations;
    const totalDepensesDeductibles = depensesMois.filter((d) => d.deductible).reduce((s, d) => s + (Number(d.montant) || 0), 0);
    const totalDepensesNonDeductibles = depensesMois.filter((d) => !d.deductible).reduce((s, d) => s + (Number(d.montant) || 0), 0);
    const resultatNet = totalRecettes - totalDepensesDeductibles - totalDepensesNonDeductibles;

    // Facturé ≠ encaissé : le résultat net reste calculé sur le facturé (base de
    // vos déclarations), mais la trésorerie réellement rentrée est affichée à part.
    const encaisseConciergerie = passagesMois.filter((p) => p.paye).reduce((s, p) => s + (Number(p.total) || 0), 0);
    const encaisseTravaux = travauxMois.filter((t) => t.paye).reduce((s, t) => s + (Number(t.heures) || 0) * (Number(t.tauxHoraire) || 0) + (t.fournitures || []).reduce((s2, f) => s2 + (Number(f.montant) || 0), 0), 0);
    const totalEncaisse = totalDons + encaisseConciergerie + encaisseTravaux + totalSolidairePayant + totalCotisations;
    const resteAEncaisser = totalRecettes - totalEncaisse;

    return { m, totalDons, totalConciergerie, totalTravauxMO, totalTravauxFournitures, totalSolidairePayant, totalCotisations, totalRecettes, totalDepensesDeductibles, totalDepensesNonDeductibles, resultatNet, totalEncaisse, resteAEncaisser };
  });

  function copierMois(l) {
    const text = `Bilan ${libelleMois(l.m)} — Vosges Entraide Habitat
Dons collectés : ${eur(l.totalDons)}
Facturation conciergerie : ${eur(l.totalConciergerie)}
Travaux — main d'œuvre : ${eur(l.totalTravauxMO)}
Travaux — fournitures : ${eur(l.totalTravauxFournitures)}
Solidaire à prix réduit : ${eur(l.totalSolidairePayant)}
Cotisations adhérents : ${eur(l.totalCotisations)}
TOTAL RECETTES : ${eur(l.totalRecettes)}
Dépenses déductibles : ${eur(l.totalDepensesDeductibles)}
Dépenses non déductibles : ${eur(l.totalDepensesNonDeductibles)}
RÉSULTAT NET : ${eur(l.resultatNet)}
Dont réellement encaissé : ${eur(l.totalEncaisse)}
Reste à encaisser : ${eur(l.resteAEncaisser)}`;
    copyToClipboard(text, () => {});
  }

  return (
    <div>
      <div style={{ fontSize: 11.5, color: C.textMuted, background: C.panel2, border: `1px solid ${C.border}`, borderRadius: 9, padding: 10, marginBottom: 16 }}>
        Ces montants sont les chiffres bruts enregistrés dans l'application, regroupés par mois. Seuls les travaux au statut « Facturé » sont comptés — pas les devis en attente. Le résultat net déduit vos dépenses marquées « déductible » dans l'onglet Dépenses. Le calcul de vos cotisations dépend de votre statut exact (auto-entrepreneur, association employeur...) et reste à faire de votre côté ou avec votre expert-comptable — ces chiffres sont la base dont vous aurez besoin.
      </div>
      {lignes.length === 0 && <div style={{ color: C.textMuted, fontSize: 13 }}>Pas encore assez de données pour établir un bilan.</div>}
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {lignes.map((l) => (
          <Card key={l.m} style={{ padding: 16 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
              <div style={{ fontWeight: 700, fontSize: 14, textTransform: "capitalize" }}>{libelleMois(l.m)}</div>
              <Btn variant="ghost" onClick={() => copierMois(l)}><Copy size={12} /> Copier ce mois</Btn>
            </div>
            <div style={{ fontSize: 11, color: C.textMuted, marginBottom: 6, fontWeight: 600 }}>Recettes</div>
            <div className="veh-grid" style={{ display: "grid", gridTemplateColumns: "repeat(6,1fr)", gap: 10, marginBottom: 12 }}>
              <div style={{ background: C.panel2, borderRadius: 8, padding: 10 }}>
                <div style={{ fontSize: 10.5, color: C.textMuted }}>Dons</div>
                <div style={{ fontWeight: 700, fontSize: 15 }}>{eur(l.totalDons)}</div>
              </div>
              <div style={{ background: C.panel2, borderRadius: 8, padding: 10 }}>
                <div style={{ fontSize: 10.5, color: C.textMuted }}>Conciergerie</div>
                <div style={{ fontWeight: 700, fontSize: 15 }}>{eur(l.totalConciergerie)}</div>
              </div>
              <div style={{ background: C.panel2, borderRadius: 8, padding: 10 }}>
                <div style={{ fontSize: 10.5, color: C.textMuted }}>Travaux (m.o.)</div>
                <div style={{ fontWeight: 700, fontSize: 15 }}>{eur(l.totalTravauxMO)}</div>
              </div>
              <div style={{ background: C.panel2, borderRadius: 8, padding: 10 }}>
                <div style={{ fontSize: 10.5, color: C.textMuted }}>Travaux (fournitures)</div>
                <div style={{ fontWeight: 700, fontSize: 15 }}>{eur(l.totalTravauxFournitures)}</div>
              </div>
              <div style={{ background: C.panel2, borderRadius: 8, padding: 10 }}>
                <div style={{ fontSize: 10.5, color: C.textMuted }}>Solidaire (prix réduit)</div>
                <div style={{ fontWeight: 700, fontSize: 15 }}>{eur(l.totalSolidairePayant)}</div>
              </div>
              <div style={{ background: C.panel2, borderRadius: 8, padding: 10 }}>
                <div style={{ fontSize: 10.5, color: C.textMuted }}>Cotisations</div>
                <div style={{ fontWeight: 700, fontSize: 15 }}>{eur(l.totalCotisations)}</div>
              </div>
            </div>
            <div style={{ fontSize: 11, color: C.textMuted, marginBottom: 6, fontWeight: 600 }}>Dépenses</div>
            <div className="veh-grid" style={{ display: "grid", gridTemplateColumns: "repeat(2,1fr)", gap: 10 }}>
              <div style={{ background: C.panel2, borderRadius: 8, padding: 10 }}>
                <div style={{ fontSize: 10.5, color: C.textMuted }}>Déductibles</div>
                <div style={{ fontWeight: 700, fontSize: 15 }}>{eur(l.totalDepensesDeductibles)}</div>
              </div>
              <div style={{ background: C.panel2, borderRadius: 8, padding: 10 }}>
                <div style={{ fontSize: 10.5, color: C.textMuted }}>Non déductibles</div>
                <div style={{ fontWeight: 700, fontSize: 15 }}>{eur(l.totalDepensesNonDeductibles)}</div>
              </div>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", marginTop: 10, paddingTop: 10, borderTop: `1px solid ${C.border}`, fontWeight: 700 }}>
              <span>Résultat net du mois (facturé)</span><span style={{ color: C.amber }}>{eur(l.resultatNet)}</span>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6, fontSize: 12.5, color: C.textMuted }}>
              <span>Dont réellement encaissé</span>
              <span>{eur(l.totalEncaisse)}{l.resteAEncaisser > 0 ? ` · reste ${eur(l.resteAEncaisser)} à encaisser` : ""}</span>
            </div>
          </Card>
        ))}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------
   VUE : SAUVEGARDE — export/import complet, indépendant de Firebase
--------------------------------------------------------------- */
function SauvegardeView({ data, setters }) {
  const [confirmRestore, setConfirmRestore] = useState(null); // parsed backup pending confirmation
  const [message, setMessage] = useState(null);
  const fileInputRef = useRef(null);

  function telecharger() {
    const payload = {
      app: "VosgesEntraideHabitat",
      version: 1,
      exportedAt: new Date().toISOString(),
      data,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `Sauvegarde_VosgesEntraideHabitat_${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setMessage({ ok: true, text: "Sauvegarde téléchargée." });
  }

  function choisirFichier(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || !parsed.data) throw new Error("Fichier invalide");
        setConfirmRestore(parsed);
        setMessage(null);
      } catch (e) {
        setMessage({ ok: false, text: "Ce fichier ne ressemble pas à une sauvegarde valide." });
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  function confirmerRestauration() {
    if (!confirmRestore) return;
    const d = confirmRestore.data || {};
    Object.entries(setters).forEach(([key, setter]) => {
      if (Array.isArray(d[key]) || (d[key] && typeof d[key] === "object")) setter(d[key]);
    });
    setMessage({ ok: true, text: `Sauvegarde du ${new Date(confirmRestore.exportedAt).toLocaleString("fr-FR")} restaurée.` });
    setConfirmRestore(null);
  }

  const resume = Object.entries(data).map(([k, v]) => `${k.replace("veh-", "")} : ${Array.isArray(v) ? v.length : (v && typeof v === "object" ? Object.keys(v).length : 0)}`).join(" · ");

  return (
    <div style={{ maxWidth: 560, display: "flex", flexDirection: "column", gap: 18 }}>
      <Card style={{ padding: 18 }}>
        <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 8, display: "flex", alignItems: "center", gap: 7 }}><Save size={16} color={C.amber} /> Sauvegarde complète</div>
        <div style={{ fontSize: 12, color: C.textMuted, marginBottom: 10 }}>Télécharge toutes les données de l'application (clients, factures, dons, équipe, etc.) dans un seul fichier, indépendant de Firebase. À faire régulièrement, et à conserver en lieu sûr (mail à vous-même, clé USB...).</div>
        <div style={{ fontSize: 11, color: C.textMuted, marginBottom: 12 }}>{resume}</div>
        <Btn onClick={telecharger}><Download size={13} /> Télécharger une sauvegarde</Btn>
      </Card>

      <Card style={{ padding: 18 }}>
        <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 8 }}>Restaurer une sauvegarde</div>
        <div style={{ fontSize: 12, color: C.textMuted, marginBottom: 12 }}>⚠️ Remplace entièrement les données actuelles par celles du fichier choisi. À utiliser uniquement en cas de problème.</div>
        <input ref={fileInputRef} type="file" accept="application/json" onChange={choisirFichier} style={{ display: "none" }} />
        <Btn variant="ghost" onClick={() => fileInputRef.current?.click()}>Choisir un fichier de sauvegarde</Btn>

        {confirmRestore && (
          <div style={{ marginTop: 14, background: "rgba(248,113,113,0.1)", border: `1px solid ${C.red}`, borderRadius: 9, padding: 12 }}>
            <div style={{ fontSize: 12.5, color: C.text, marginBottom: 8 }}>
              Confirmer la restauration de la sauvegarde du <b>{new Date(confirmRestore.exportedAt).toLocaleString("fr-FR")}</b> ? Toutes les données actuelles seront remplacées.
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <Btn variant="danger" onClick={confirmerRestauration}>Confirmer et restaurer</Btn>
              <Btn variant="ghost" onClick={() => setConfirmRestore(null)}>Annuler</Btn>
            </div>
          </div>
        )}

        {message && (
          <div style={{ marginTop: 12, fontSize: 12.5, color: message.ok ? C.green : C.red }}>{message.text}</div>
        )}
      </Card>
    </div>
  );
}

function ImpactView({ clients, beneficiaires, interventions, materiaux, dons, adherents, passages, parcours, travaux, depenses }) {
  const menagesAides = beneficiaires.length;
  const interventionsFaites = interventions.filter((i) => i.statut === "Fait").length;
  const interventionsGratuites = interventions.filter((i) => i.gratuit).length;
  const totalSolidairePayant = interventions.filter((i) => !i.gratuit).reduce((s, i) => s + (Number(i.montant) || 0), 0);
  const materiauxRedistribues = materiaux.filter((m) => m.statut === "Redistribué").length;
  const valeurMateriaux = materiaux.reduce((s, m) => s + (Number(m.valeur) || 0), 0);
  const totalDons = dons.reduce((s, d) => s + (Number(d.montant) || 0), 0);
  const clientsActifs = clients.length;
  const adherentsCount = adherents.length;
  const totalCotisations = adherents.filter((a) => a.cotisationPayee).reduce((s, a) => s + (Number(a.montant) || 0), 0);
  const totalFacturePassages = passages.reduce((s, p) => s + (Number(p.total) || 0), 0);
  const heuresInsertion = (parcours || []).reduce((s, p) => s + (Number(p.heures) || 0), 0);
  const travauxFactures = (travaux || []).filter((t) => t.statut === "Facturé");
  const totalTravaux = travauxFactures.reduce((s, t) => s + (Number(t.heures) || 0) * (Number(t.tauxHoraire) || 0) + (t.fournitures || []).reduce((s2, f) => s2 + (Number(f.montant) || 0), 0), 0);
  const totalDepenses = (depenses || []).filter((d) => d.valide !== false).reduce((s, d) => s + (Number(d.montant) || 0), 0);
  const totalRecettesGlobal = totalDons + totalFacturePassages + totalTravaux + totalSolidairePayant + totalCotisations;
  const resultatNetGlobal = totalRecettesGlobal - totalDepenses;

  const stat = (label, value, Icon) => (
    <Card style={{ padding: 16, display: "flex", flexDirection: "column", gap: 6 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, color: C.textMuted, fontSize: 12 }}><Icon size={14} /> {label}</div>
      <div style={{ fontWeight: 700, fontSize: 26, color: C.amber }}>{value}</div>
    </Card>
  );

  return (
    <div>
      <div style={{ fontSize: 12.5, color: C.textMuted, marginBottom: 16 }}>
        Chiffres cumulés depuis la création de l'application — utile pour vos dossiers de subvention (Mairie, Département, Région, FDVA).
      </div>
      <div className="veh-grid" style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 14 }}>
        {stat("Ménages aidés", menagesAides, Wrench)}
        {stat("Interventions solidaires réalisées", interventionsFaites, CheckCircle2)}
        {stat("Dont gratuites", interventionsGratuites, Heart)}
        {stat("Solidaire à prix réduit", eur(totalSolidairePayant), Wrench)}
        {stat("Matériaux redistribués", materiauxRedistribues, Package)}
        {stat("Valeur des matériaux reçus", eur(valeurMateriaux), Package)}
        {stat("Adhérents", adherentsCount, IdCard)}
        {stat("Cotisations encaissées", eur(totalCotisations), IdCard)}
        {stat("Clients conciergerie actifs", clientsActifs, Home)}
        {stat("Total dons collectés", eur(totalDons), Heart)}
        {stat("Total facturé conciergerie", eur(totalFacturePassages), FileText)}
        {stat("Total facturé travaux", eur(totalTravaux), Hammer)}
        {stat("Heures d'insertion cumulées", heuresInsertion + " h", TrendingUp)}
        {stat("Total dépenses", eur(totalDepenses), TrendingDown)}
        {stat("Résultat net global", eur(resultatNetGlobal), Calculator)}
      </div>
      {clientsActifs > 0 && (interventionsFaites + menagesAides) === 0 && (
        <div style={{ marginTop: 16, fontSize: 12, color: C.amber, background: "rgba(232,163,61,0.1)", border: `1px solid ${C.amber}`, borderRadius: 9, padding: 10 }}>
          Rappel : vos statuts prévoient que la conciergerie reste une activité accessoire. Pensez à renseigner le bricolage solidaire au fur et à mesure pour garder une vision d'ensemble équilibrée.
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------
   VUE : ESPACE CLIENT
--------------------------------------------------------------- */
/* L'espace client ne reçoit plus la liste des clients ni celle des passages :
   il lit un document dédié, veh_client_view/{clientId}, que les règles Firestore
   n'ouvrent qu'à ce client. Auparavant, un simple menu déroulant permettait de
   consulter la facturation de n'importe quel autre client. */
function ClientPortal({ clientId }) {
  const [fiche, setFiche] = useState(null);
  const [etat, setEtat] = useState("chargement");

  useEffect(() => {
    const db = window.__vehDb;
    if (!db || !clientId) { setEtat("absente"); return; }
    const unsub = db.collection("veh_client_view").doc(clientId).onSnapshot(
      (snap) => {
        if (!snap.exists) { setEtat("absente"); return; }
        try {
          setFiche(JSON.parse(snap.data().value));
          setEtat("ok");
        } catch (e) { setEtat("absente"); }
      },
      () => setEtat("refus")
    );
    return () => unsub && unsub();
  }, [clientId]);

  if (etat === "chargement") return <Card style={{ padding: 40, textAlign: "center", color: C.textMuted }}>Chargement de votre espace...</Card>;
  if (etat === "refus") return <Card style={{ padding: 40, textAlign: "center", color: C.red }}>Accès refusé. Contactez l'association.</Card>;
  if (etat === "absente" || !fiche) return <Card style={{ padding: 40, textAlign: "center", color: C.textMuted }}>Votre espace n'est pas encore prêt. Il le sera dès votre premier passage enregistré.</Card>;

  const client = fiche;
  const mine = fiche.passages || [];
  const formule = FORMULES.find((f) => f.id === client.formule);

  return (
    <div>
      <div className="veh-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 18 }}>
          <Card style={{ padding: 18 }}>
            <div style={{ fontWeight: 700, fontSize: 17 }}>{client.nom}</div>
            <div style={{ color: C.textMuted, fontSize: 13, marginBottom: 12 }}>{client.adresse}</div>
            <div style={{ display: "flex", alignItems: "center", gap: 6, color: C.amber, marginBottom: 6 }}>
              <Star size={14} fill={C.amber} /> {formule?.label} — {formule?.duree}
            </div>
            <div style={{ fontSize: 12, color: C.textMuted }}>{formule && remiseLabel(formule)} sur toutes les prestations{formule?.avantage ? " · " + formule.avantage : ""}</div>
          </Card>
          <Card style={{ padding: 18 }}>
            <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 10 }}>Historique des passages</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 260, overflowY: "auto" }}>
              {mine.length === 0 && <div style={{ color: C.textMuted, fontSize: 12.5 }}>Aucun passage pour l'instant.</div>}
              {mine.map((p) => (
                <div key={p.id} style={{ background: C.panel2, borderRadius: 8, padding: 9, display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 12.5 }}>
                  <span>{new Date(p.date + "T00:00").toLocaleDateString("fr-FR")}</span>
                  <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ fontSize: 10.5, color: p.paye ? C.green : C.amber }}>{p.paye ? "réglé" : "à régler"}</span>
                    <span style={{ color: C.amber, fontWeight: 600 }}>{eur(p.total)}</span>
                  </span>
                </div>
              ))}
            </div>
            {mine.length > 0 && (
              <>
                <div style={{ display: "flex", justifyContent: "space-between", marginTop: 12, paddingTop: 10, borderTop: `1px solid ${C.border}`, fontWeight: 700 }}>
                  <span>Total facturé</span><span style={{ color: C.amber }}>{eur(mine.reduce((s, p) => s + (Number(p.total) || 0), 0))}</span>
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6, fontSize: 12.5, color: C.textMuted }}>
                  <span>Reste à régler</span>
                  <span>{eur(mine.filter((p) => !p.paye).reduce((s, p) => s + (Number(p.total) || 0), 0))}</span>
                </div>
              </>
            )}
          </Card>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------
   AUTHENTIFICATION — vrais comptes Firebase.

   Le rôle n'est plus décidé par cette page : il est lu dans le
   document veh_users/{uid}, et les règles Firestore s'appuient
   dessus. Un utilisateur qui bidouillerait le code de la page
   n'obtiendrait rien de plus, car c'est le serveur qui refuse.
--------------------------------------------------------------- */
const AUTH_MESSAGES = {
  "auth/invalid-email": "Cette adresse email n'est pas valide.",
  "auth/user-not-found": "Aucun compte ne correspond à cette adresse.",
  "auth/wrong-password": "Mot de passe incorrect.",
  "auth/invalid-credential": "Email ou mot de passe incorrect.",
  "auth/too-many-requests": "Trop de tentatives. Patientez quelques minutes avant de réessayer.",
  "auth/network-request-failed": "Pas de connexion internet.",
  "auth/weak-password": "Mot de passe trop court : 6 caractères minimum.",
  "auth/email-already-in-use": "Un compte existe déjà avec cette adresse.",
  "auth/requires-recent-login": "Par sécurité, déconnectez-vous et reconnectez-vous avant de changer votre mot de passe.",
  // Renvoyé quand la connexion par email/mot de passe n'a pas été activée dans
  // la console Firebase : le code brut n'aide personne, le message si.
  "auth/configuration-not-found": "La connexion par mot de passe n'est pas encore activée sur le projet Firebase (console → Authentication → Sign-in method → E-mail/Mot de passe).",
  "auth/operation-not-allowed": "La connexion par mot de passe n'est pas activée sur le projet Firebase (console → Authentication → Sign-in method → E-mail/Mot de passe).",
  "auth/unauthorized-domain": "L'adresse depuis laquelle vous ouvrez l'application n'est pas autorisée (console → Authentication → Settings → Domaines autorisés).",
};
function messageAuth(e) {
  return AUTH_MESSAGES[e && e.code] || (e && e.message) || "Une erreur est survenue.";
}

/* Firebase exige un identifiant au format d'une adresse email. Pour les
   personnes qui n'ont pas d'adresse (et il y en a), on en fabrique une sur un
   domaine interne : elle ne reçoit aucun courrier et ne sert qu'à se connecter.
   Seule conséquence : « mot de passe oublié » ne peut pas fonctionner pour ces
   comptes, l'administrateur redéfinit le mot de passe depuis la console
   Firebase (Authentication → la ligne de la personne → Modifier). */
const DOMAINE_INTERNE = "interne.vosges-entraide-habitat.fr";

function estIdentifiantInterne(email) {
  return String(email || "").endsWith("@" + DOMAINE_INTERNE);
}

function slugIdentifiant(nom) {
  const base = String(nom || "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // retire les accents
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, ".")
    .replace(/^\.+|\.+$/g, "");
  return base || "membre";
}

function Login() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [resetMsg, setResetMsg] = useState("");

  function submit() {
    if (!email || !password) { setError("Renseignez votre identifiant et votre mot de passe."); return; }
    setBusy(true); setError(""); setResetMsg("");
    firebase.auth().signInWithEmailAndPassword(email.trim(), password)
      .catch((e) => { setError(messageAuth(e)); })
      .finally(() => setBusy(false));
  }

  function motDePasseOublie() {
    if (!email) { setError("Saisissez d'abord votre identifiant, puis recliquez ici."); return; }
    setError(""); setResetMsg("");
    // Un identifiant interne ne correspond à aucune boîte aux lettres : envoyer
    // un email de réinitialisation échouerait en silence côté destinataire.
    if (estIdentifiantInterne(email.trim())) {
      setError("Votre identifiant n'est pas une adresse email : aucun message ne peut vous être envoyé. Demandez à l'administrateur de l'association de réinitialiser votre mot de passe.");
      return;
    }
    firebase.auth().sendPasswordResetEmail(email.trim())
      .then(() => setResetMsg("Un email de réinitialisation vient d'être envoyé. Pensez à regarder dans les indésirables."))
      .catch((e) => setError(messageAuth(e)));
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "center", marginTop: 30 }}>
        <img src={LOGO_FULL} alt="Vosges Entraide Habitat" style={{ height: 64, objectFit: "contain" }} />
      </div>
      <Card style={{ padding: 28, maxWidth: 380, margin: "20px auto 40px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
          <ShieldCheck size={18} color={C.amber} />
          <div style={{ fontWeight: 700, fontSize: 15 }}>Connexion</div>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <Field label="Adresse email ou identifiant">
            <TextInput type="text" autoComplete="username" value={email} onChange={(e) => setEmail(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} />
          </Field>
          <Field label="Mot de passe">
            <TextInput type="password" autoComplete="current-password" value={password} onChange={(e) => setPassword(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} />
          </Field>
        </div>
        {error && <div style={{ color: C.red, fontSize: 12, marginTop: 10, lineHeight: 1.5 }}>{error}</div>}
        {resetMsg && <div style={{ color: C.green, fontSize: 12, marginTop: 10, lineHeight: 1.5 }}>{resetMsg}</div>}
        <Btn onClick={submit} disabled={busy} style={{ marginTop: 14, width: "100%", justifyContent: "center" }}>
          {busy ? "Connexion..." : "Se connecter"}
        </Btn>
        <button
          type="button"
          onClick={motDePasseOublie}
          style={{ background: "none", border: "none", color: C.textMuted, fontSize: 11.5, marginTop: 12, cursor: "pointer", textDecoration: "underline", padding: 0 }}
        >
          Mot de passe oublié
        </button>
        <div style={{ fontSize: 10.5, color: C.textMuted, marginTop: 14, lineHeight: 1.5 }}>
          Votre compte est créé par l'administrateur de l'association. Si vous n'en avez pas encore, contactez-le.
        </div>
      </Card>
    </div>
  );
}

function ChangePasswordCard({ title }) {
  const [cur, setCur] = useState("");
  const [next, setNext] = useState("");
  const [confirm, setConfirm] = useState("");
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);

  function submit() {
    const user = firebase.auth().currentUser;
    if (!user) { setMsg({ ok: false, text: "Session expirée : reconnectez-vous." }); return; }
    if (!next || next !== confirm) { setMsg({ ok: false, text: "Les nouveaux mots de passe ne correspondent pas." }); return; }
    if (next.length < 6) { setMsg({ ok: false, text: "Le nouveau mot de passe doit faire au moins 6 caractères." }); return; }

    setBusy(true);
    // Firebase exige une connexion récente pour changer un mot de passe :
    // on revérifie le mot de passe actuel, ce qui sert aussi de contrôle.
    const cred = firebase.auth.EmailAuthProvider.credential(user.email, cur);
    user.reauthenticateWithCredential(cred)
      .then(() => user.updatePassword(next))
      .then(() => {
        setCur(""); setNext(""); setConfirm("");
        setMsg({ ok: true, text: "Mot de passe mis à jour." });
      })
      .catch((e) => setMsg({ ok: false, text: messageAuth(e) }))
      .finally(() => setBusy(false));
  }

  return (
    <Card style={{ padding: 18, maxWidth: 380 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
        <Lock size={15} color={C.amber} />
        <div style={{ fontWeight: 700, fontSize: 14 }}>{title}</div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        <Field label="Mot de passe actuel"><TextInput type="password" autoComplete="current-password" value={cur} onChange={(e) => setCur(e.target.value)} /></Field>
        <Field label="Nouveau mot de passe (6 caractères minimum)"><TextInput type="password" autoComplete="new-password" value={next} onChange={(e) => setNext(e.target.value)} /></Field>
        <Field label="Confirmer le nouveau mot de passe"><TextInput type="password" autoComplete="new-password" value={confirm} onChange={(e) => setConfirm(e.target.value)} /></Field>
        {msg && <div style={{ fontSize: 12, color: msg.ok ? C.green : C.red, lineHeight: 1.5 }}>{msg.text}</div>}
        <Btn onClick={submit} disabled={busy}>{busy ? "Mise à jour..." : "Mettre à jour"}</Btn>
      </div>
    </Card>
  );
}

/* ---------------------------------------------------------------
   VUE : COMPTES — création et révocation des accès (admin).

   La création passe par une seconde instance Firebase : sans cela,
   createUserWithEmailAndPassword connecterait l'administrateur sous
   l'identité du compte qu'il vient de créer, et le déconnecterait.
--------------------------------------------------------------- */
function ComptesView({ collaborateurs, clients, appUrl }) {
  const [comptes, setComptes] = useState([]);
  const [chargement, setChargement] = useState(true);
  const [form, setForm] = useState({ email: "", motDePasse: "", role: "collab", lienId: "", nom: "", sansEmail: false, identifiant: "" });
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);
  const [dernierAcces, setDernierAcces] = useState(null);

  useEffect(() => {
    const db = window.__vehDb;
    if (!db) { setChargement(false); return; }
    const unsub = db.collection("veh_users").onSnapshot(
      (snap) => {
        setComptes(snap.docs.map((d) => ({ uid: d.id, ...d.data() })));
        setChargement(false);
      },
      () => setChargement(false)
    );
    return () => unsub && unsub();
  }, []);

  // Identifiant réellement utilisé pour se connecter : une vraie adresse, ou une
  // adresse interne fabriquée pour les personnes qui n'en ont pas.
  const identifiantFinal = form.sansEmail
    ? (form.identifiant || slugIdentifiant(form.nom)) + "@" + DOMAINE_INTERNE
    : form.email.trim();

  function creer() {
    const db = window.__vehDb;
    if (!db) { setMsg({ ok: false, text: "Base non connectée." }); return; }
    if (!form.sansEmail && !form.email) { setMsg({ ok: false, text: "Renseignez l'adresse email, ou cochez « cette personne n'a pas d'adresse email »." }); return; }
    if (form.sansEmail && !form.nom && !form.identifiant) { setMsg({ ok: false, text: "Renseignez au moins le nom, il sert à composer l'identifiant." }); return; }
    if (!form.motDePasse) { setMsg({ ok: false, text: "Mot de passe provisoire obligatoire." }); return; }
    if (form.role !== "admin" && !form.lienId) {
      setMsg({ ok: false, text: form.role === "collab" ? "Choisissez le collaborateur associé à ce compte." : "Choisissez le client associé à ce compte." });
      return;
    }

    setBusy(true); setMsg(null);
    const secondaire = firebase.apps.find((a) => a.name === "veh-secondaire")
      || firebase.initializeApp(firebaseConfig, "veh-secondaire");

    secondaire.auth().createUserWithEmailAndPassword(identifiantFinal, form.motDePasse)
      .then((cred) => {
        const uid = cred.user.uid;
        const doc = { role: form.role, nom: form.nom || identifiantFinal, email: identifiantFinal, interne: !!form.sansEmail, creeLe: new Date().toISOString() };
        if (form.role === "collab") doc.collabId = form.lienId;
        if (form.role === "client") doc.clientId = form.lienId;
        return db.collection("veh_users").doc(uid).set(doc).then(() => secondaire.auth().signOut());
      })
      .then(() => {
        setDernierAcces({ email: identifiantFinal, motDePasse: form.motDePasse, nom: form.nom, role: form.role, interne: !!form.sansEmail });
        setMsg({ ok: true, text: "Compte créé. Transmettez les identifiants ci-dessous à la personne concernée." });
        setForm({ email: "", motDePasse: "", role: "collab", lienId: "", nom: "", sansEmail: false, identifiant: "" });
      })
      .catch((e) => setMsg({ ok: false, text: messageAuth(e) }))
      .finally(() => setBusy(false));
  }

  function revoquer(uid) {
    const db = window.__vehDb;
    if (!db) return;
    db.collection("veh_users").doc(uid).delete()
      .then(() => setMsg({ ok: true, text: "Accès révoqué. La personne ne peut plus rien lire, même si elle connaît encore son mot de passe. Pour supprimer définitivement le compte, passez par la console Firebase → Authentication." }))
      .catch((e) => setMsg({ ok: false, text: messageAuth(e) }));
  }

  const messageAcces = dernierAcces
    ? `Bonjour ${dernierAcces.nom || ""},\n\nVotre accès à l'application Vosges Entraide Habitat est prêt.\n\n${appUrl ? `Lien de l'application : ${appUrl}\n\n` : ""}Identifiant : ${dernierAcces.email}\nMot de passe provisoire : ${dernierAcces.motDePasse}\n\n${dernierAcces.interne ? "Cet identifiant ressemble à une adresse email mais n'en est pas une : il sert uniquement à vous connecter, n'y envoyez rien. Si vous oubliez votre mot de passe, demandez-moi de le réinitialiser.\n\n" : ""}Connectez-vous avec ces identifiants, puis changez immédiatement votre mot de passe dans l'onglet « Mon compte ». Ce message contient un mot de passe : supprimez-le une fois la connexion faite.\n\nÀ bientôt,\nVosges Entraide Habitat`
    : "";

  const libelleRole = { admin: "Administrateur", collab: "Collaborateur", client: "Client" };
  const cible = form.role === "collab" ? collaborateurs : clients;

  return (
    <div className="veh-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 18 }}>
      <Card style={{ padding: 18 }}>
        <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 4, display: "flex", alignItems: "center", gap: 7 }}>
          <ShieldCheck size={16} color={C.amber} /> Comptes ayant accès
        </div>
        <div style={{ fontSize: 11.5, color: C.textMuted, marginBottom: 14 }}>
          Seules les personnes listées ici peuvent ouvrir l'application. Révoquer un accès est immédiat.
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 480, overflowY: "auto" }}>
          {chargement && <div style={{ color: C.textMuted, fontSize: 12.5 }}>Chargement...</div>}
          {!chargement && comptes.length === 0 && <div style={{ color: C.textMuted, fontSize: 12.5 }}>Aucun compte enregistré.</div>}
          {comptes.map((c) => {
            const lie = c.collabId
              ? collaborateurs.find((x) => x.id === c.collabId)?.nom
              : c.clientId ? clients.find((x) => x.id === c.clientId)?.nom : null;
            return (
              <div key={c.uid} style={{ background: C.panel2, border: `1px solid ${C.border}`, borderRadius: 9, padding: 10, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontWeight: 600, fontSize: 13 }}>{c.nom || c.email || c.uid}</div>
                  <div style={{ fontSize: 11, color: C.textMuted, wordBreak: "break-all" }}>
                    {libelleRole[c.role] || c.role}{lie ? ` · ${lie}` : ""}{c.email ? ` · ${c.email}` : ""}{c.interne ? " · identifiant interne" : ""}
                  </div>
                </div>
                {c.role !== "admin" && <ConfirmDelete onConfirm={() => revoquer(c.uid)} />}
              </div>
            );
          })}
        </div>
      </Card>

      <Card style={{ padding: 18 }}>
        <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 12 }}>Créer un accès</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <Field label="Type d'accès">
            <Select value={form.role} onChange={(e) => setForm({ ...form, role: e.target.value, lienId: "" })}>
              <option value="collab">Collaborateur — saisie, ses interventions et ses frais</option>
              <option value="client">Client — consultation de sa seule fiche</option>
              <option value="admin">Administrateur — accès complet</option>
            </Select>
          </Field>
          {form.role !== "admin" && (
            <Field label={form.role === "collab" ? "Collaborateur associé" : "Client associé"}>
              <Select value={form.lienId} onChange={(e) => {
                const choisi = cible.find((x) => x.id === e.target.value);
                setForm({ ...form, lienId: e.target.value, nom: form.nom || (choisi ? choisi.nom : "") });
              }}>
                <option value="">— choisir —</option>
                {cible.map((x) => <option key={x.id} value={x.id}>{x.nom}</option>)}
              </Select>
            </Field>
          )}
          <Field label="Nom affiché"><TextInput value={form.nom} onChange={(e) => setForm({ ...form, nom: e.target.value })} /></Field>

          <Field label="Cette personne a-t-elle une adresse email ?">
            <ToggleYesNo
              value={!form.sansEmail}
              onChange={(v) => setForm({ ...form, sansEmail: !v, identifiant: !v ? (form.identifiant || slugIdentifiant(form.nom)) : "" })}
            />
          </Field>

          {form.sansEmail ? (
            <>
              <Field label="Identifiant de connexion">
                <TextInput
                  value={form.identifiant}
                  onChange={(e) => setForm({ ...form, identifiant: slugIdentifiant(e.target.value) })}
                  placeholder={slugIdentifiant(form.nom)}
                />
              </Field>
              <div style={{ fontSize: 11.5, color: C.textMuted, lineHeight: 1.5, marginTop: -4 }}>
                La personne se connectera avec <b style={{ color: C.amber }}>{identifiantFinal}</b>. Ce n'est pas une vraie
                adresse : elle ne reçoit aucun courrier et sert uniquement d'identifiant. En cas de mot de passe oublié,
                c'est à vous de le redéfinir depuis la console Firebase (Authentication → la ligne de la personne → Modifier),
                car aucun email de réinitialisation ne peut lui parvenir.
              </div>
            </>
          ) : (
            <Field label="Adresse email"><TextInput type="email" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} /></Field>
          )}
          <Field label="Mot de passe provisoire (6 caractères minimum)">
            <TextInput value={form.motDePasse} onChange={(e) => setForm({ ...form, motDePasse: e.target.value })} placeholder="La personne le changera à sa première connexion" />
          </Field>
          <Btn onClick={creer} disabled={busy}><Plus size={14} /> {busy ? "Création..." : "Créer le compte"}</Btn>
          {msg && (
            <div style={{ fontSize: 12, lineHeight: 1.5, padding: 10, borderRadius: 8, color: msg.ok ? C.green : C.red, background: msg.ok ? "rgba(74,222,128,0.1)" : "rgba(248,113,113,0.1)", border: `1px solid ${msg.ok ? C.green : C.red}` }}>
              {msg.text}
            </div>
          )}
          {dernierAcces && (
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              <textarea
                readOnly
                value={messageAcces}
                onClick={(e) => e.target.select()}
                style={{
                  whiteSpace: "pre-wrap", fontSize: 12.5, lineHeight: 1.6, color: C.text,
                  background: C.panel2, border: `1px solid ${C.border}`, borderRadius: 10, padding: 14,
                  width: "100%", height: 180, resize: "vertical",
                }}
              />
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <Btn variant="ghost" onClick={() => copyToClipboard(messageAcces, () => {})}><Copy size={13} /> Copier le message</Btn>
                <Btn variant="ghost" onClick={() => setDernierAcces(null)}>Masquer</Btn>
              </div>
            </div>
          )}
        </div>
      </Card>
    </div>
  );
}

/* ---------------------------------------------------------------
   DIAGNOSTIC STOCKAGE — teste l'écriture/lecture partagée en direct
   et affiche l'erreur réelle, sans avoir besoin d'outils techniques
--------------------------------------------------------------- */
function StorageDiagnostic() {
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);

  function runTest() {
    setBusy(true);
    setMsg(null);
    const testValue = "test-" + Date.now();
    try {
      const db = window.__vehDb;
      if (!db) {
        setMsg({ ok: false, text: "La base Firebase n'est pas connectée. Vérifiez que le bloc firebaseConfig en haut du fichier a bien été rempli avec vos propres identifiants (voir les instructions juste au-dessus dans le code)." });
        setBusy(false);
        return;
      }
      db.collection("veh_data").doc("veh-diagnostic").set({ value: testValue })
        .then(() => db.collection("veh_data").doc("veh-diagnostic").get())
        .then((snap) => {
          const val = snap.exists ? snap.data().value : null;
          if (val === testValue) {
            // Le document de test ne doit pas rester dans la base après coup.
            db.collection("veh_data").doc("veh-diagnostic").delete().catch(() => {});
            setMsg({ ok: true, text: "Écriture ET lecture réussies. La base partagée fonctionne sur cet appareil, à cet instant." });
          } else {
            setMsg({ ok: false, text: "L'écriture n'a renvoyé aucune erreur, mais la relecture ne renvoie pas la même valeur (reçu : " + JSON.stringify(val) + "). Réessayez dans quelques secondes." });
          }
        })
        .catch((e) => setMsg({ ok: false, text: "Échec lors de l'écriture/lecture : " + (e && e.message ? e.message : String(e)) + " — vérifiez que l'authentification anonyme est bien activée dans Firebase (Authentication → Sign-in method) et que les règles Firestore correspondent (voir instructions en haut du fichier)." }))
        .finally(() => setBusy(false));
    } catch (e) {
      setMsg({ ok: false, text: "Erreur immédiate : " + (e && e.message ? e.message : String(e)) });
      setBusy(false);
    }
  }

  return (
    <Card style={{ padding: 18 }}>
      <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 8 }}>Diagnostic de la base partagée</div>
      <div style={{ fontSize: 11.5, color: C.textMuted, marginBottom: 10 }}>
        Ce test écrit une valeur dans Firebase, puis la relit immédiatement. Faites-le sur chaque appareil pour voir où ça bloque.
      </div>
      <Btn onClick={runTest} disabled={busy}>{busy ? "Test en cours..." : "Tester l'enregistrement maintenant"}</Btn>
      {msg && (
        <div style={{
          marginTop: 12, fontSize: 12, lineHeight: 1.5, padding: 10, borderRadius: 8,
          background: msg.ok ? "rgba(74,222,128,0.1)" : "rgba(248,113,113,0.1)",
          border: `1px solid ${msg.ok ? C.green : C.red}`, color: msg.ok ? C.green : C.red,
        }}>
          {msg.text}
        </div>
      )}
    </Card>
  );
}

function App() {
  const [tab, setTab] = useState("calendrier");
  const [clients, setClientsRaw] = useState([]);
  const [collaborateurs, setCollaborateursRaw] = useState([]);
  const [appointments, setAppointmentsRaw] = useState([]);
  const [passages, setPassagesRaw] = useState([]);
  const [dons, setDonsRaw] = useState([]);
  const [beneficiaires, setBeneficiairesRaw] = useState([]);
  const [interventions, setInterventionsRaw] = useState([]);
  const [materiaux, setMateriauxRaw] = useState([]);
  const [adherents, setAdherentsRaw] = useState([]);
  const [travaux, setTravauxRaw] = useState([]);
  const [parcours, setParcoursRaw] = useState([]);
  const [journal, setJournalRaw] = useState([]);
  const [compteurs, setCompteursRaw] = useState({});
  // Les numéros doivent pouvoir être réservés plusieurs fois dans le même
  // gestionnaire (CLI + DEV à la création d'un client). L'état React n'est pas
  // à jour entre deux appels synchrones : la ref fait donc foi pour la lecture.
  const compteursRef = useRef({});
  const [prestataires, setPrestatairesRaw] = useState([]);
  const [depenses, setDepensesRaw] = useState([]);
  const [selectedClientId, setSelectedClientId] = useState(null);

  // « verification » au démarrage, puis : nonconfigure (Firebase pas renseigné),
  // anonyme (personne connectée), refuse (connecté mais sans compte veh_users),
  // connecte (rôle obtenu du serveur).
  const [authEtat, setAuthEtat] = useState("verification");
  const [compte, setCompte] = useState(null);
  const [appUrl, setAppUrlRaw] = useState("");

  const role = compte ? compte.role : null;
  const loggedCollabId = compte && compte.collabId ? compte.collabId : null;

  const [loaded, setLoaded] = useState(false);
  const [storageError, setStorageError] = useState(false);
  const [savedToast, setSavedToast] = useState(null); // "ok" | "fail" | null

  function persist(key, value) {
    try {
      const db = window.__vehDb;
      if (!db) { setSavedToast("fail"); setStorageError(true); return; }
      db.collection("veh_data").doc(key).set({ value: JSON.stringify(value) })
        .then(() => {
          setSavedToast("ok");
          setStorageError(false);
          setTimeout(() => setSavedToast(null), 1800);
        })
        .catch(() => { setSavedToast("fail"); setStorageError(true); });
    } catch (e) { setSavedToast("fail"); setStorageError(true); }
  }
  /* L'espace client ne lit pas veh_data : il lit une fiche par client, écrite
     ici. C'est cette séparation qui rend impossible, côté serveur, la
     consultation d'un client par un autre. */
  function syncClientViews(listeClients, listePassages) {
    const db = window.__vehDb;
    if (!db) return;
    (listeClients || []).forEach((c) => {
      const fiche = {
        nom: c.nom, adresse: c.adresse, formule: c.formule,
        passages: (listePassages || [])
          .filter((p) => p.clientId === c.id)
          .map((p) => ({ id: p.id, date: p.date, total: p.total, numero: p.numero, paye: !!p.paye })),
      };
      db.collection("veh_client_view").doc(c.id).set({ value: JSON.stringify(fiche) }).catch(() => {});
    });
  }

  function setClients(v) { logAction("Clients", clients, v); setClientsRaw(v); persist("veh-clients", v); syncClientViews(v, passages); }
  function setCollaborateurs(v) { logAction("Équipe", collaborateurs, v); setCollaborateursRaw(v); persist("veh-collaborateurs", v); }
  function setAppointments(v) { logAction("Calendrier", appointments, v); setAppointmentsRaw(v); persist("veh-appointments", v); }
  function setPassages(v) { logAction("Passages", passages, v); setPassagesRaw(v); persist("veh-passages", v); syncClientViews(clients, v); }
  function setDons(v) { logAction("Dons", dons, v); setDonsRaw(v); persist("veh-dons", v); }
  function setBeneficiaires(v) { logAction("Ménages solidaires", beneficiaires, v); setBeneficiairesRaw(v); persist("veh-beneficiaires", v); }
  function setInterventions(v) { logAction("Interventions solidaires", interventions, v); setInterventionsRaw(v); persist("veh-interventions", v); }
  function setMateriaux(v) { logAction("Matériaux", materiaux, v); setMateriauxRaw(v); persist("veh-materiaux", v); }
  function setAdherents(v) { logAction("Adhérents", adherents, v); setAdherentsRaw(v); persist("veh-adherents", v); }
  function setTravaux(v) { logAction("Factures travaux", travaux, v); setTravauxRaw(v); persist("veh-travaux", v); }
  function setParcours(v) { logAction("Parcours insertion", parcours, v); setParcoursRaw(v); persist("veh-parcours", v); }
  function applyCompteurs(v) { compteursRef.current = v || {}; setCompteursRaw(v || {}); }
  function setCompteurs(v) { applyCompteurs(v); persist("veh-compteurs", v); }
  function setJournal(v) { setJournalRaw(v); persist("veh-journal", v); }
  function setPrestataires(v) { logAction("Prestataires", prestataires, v); setPrestatairesRaw(v); persist("veh-prestataires", v); }
  function setDepenses(v) { logAction("Dépenses", depenses, v); setDepensesRaw(v); persist("veh-depenses", v); }
  function nextNumero(prefix) {
    const base = compteursRef.current || {};
    const n = (base[prefix] || 0) + 1;
    setCompteurs({ ...base, [prefix]: n });
    return `${prefix}-${String(n).padStart(4, "0")}`;
  }
  function saveAdmin(next) {
    // Plus de mot de passe ici : les identifiants vivent dans Firebase Auth.
    if (next.appUrl !== undefined) setAppUrlRaw(next.appUrl);
    persist("veh-admin", { appUrl: next.appUrl ?? appUrl });
  }

  function actorLabel() {
    if (compte && compte.nom) return compte.nom;
    if (role === "admin") return "Administrateur";
    if (role === "collab") return "Collaborateur";
    return "Utilisateur";
  }
  function logAction(section, oldArr, newArr) {
    const action = newArr.length > oldArr.length ? "ajout" : newArr.length < oldArr.length ? "suppression" : "modification";
    const entry = { id: uid(), ts: Date.now(), actor: actorLabel(), text: `${section} — ${action}` };
    const next = [entry, ...journal].slice(0, 150);
    setJournalRaw(next);
    persist("veh-journal", next);
  }

  /* Étape 1 — initialisation Firebase et identification de la personne.
     Le rôle est lu dans veh_users/{uid} et écouté en continu : si
     l'administrateur révoque un accès, la session en cours perd ses droits
     immédiatement, sans attendre un rechargement. */
  React.useEffect(() => {
    let cancelled = false;
    let unsubUser = null;

    if (typeof firebaseConfig === "undefined" || !firebaseConfig.apiKey || firebaseConfig.apiKey === "COLLEZ_ICI_VOTRE_CONFIG") {
      setStorageError(true);
      setAuthEtat("nonconfigure");
      return;
    }
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      window.__vehDb = firebase.firestore();
    } catch (e) {
      setStorageError(true);
      setAuthEtat("nonconfigure");
      return;
    }

    const unsubAuth = firebase.auth().onAuthStateChanged((user) => {
      if (unsubUser) { unsubUser(); unsubUser = null; }
      if (cancelled) return;
      if (!user) {
        setCompte(null);
        setLoaded(false);
        setAuthEtat("anonyme");
        return;
      }
      unsubUser = window.__vehDb.collection("veh_users").doc(user.uid).onSnapshot(
        (snap) => {
          if (cancelled) return;
          if (!snap.exists) { setCompte(null); setAuthEtat("refuse"); return; }
          setCompte({ uid: user.uid, email: user.email, ...snap.data() });
          setAuthEtat("connecte");
        },
        () => { if (!cancelled) { setCompte(null); setAuthEtat("refuse"); } }
      );
    });

    return () => { cancelled = true; unsubAuth && unsubAuth(); unsubUser && unsubUser(); };
  }, []);

  /* Étape 2 — écoute des données, seulement une fois le rôle connu. Un compte
     client ne déclenche aucune lecture de veh_data : les règles la refuseraient
     de toute façon, et il n'en a pas besoin. */
  React.useEffect(() => {
    if (authEtat !== "connecte" || !compte) return;
    const db = window.__vehDb;
    if (!db) return;
    if (compte.role === "client") { setLoaded(true); return; }

    let cancelled = false;
    let unsubscribers = [];

    (function startListening() {
      const keys = {
        "veh-clients": setClientsRaw,
        "veh-collaborateurs": setCollaborateursRaw,
        "veh-appointments": setAppointmentsRaw,
        "veh-passages": setPassagesRaw,
        "veh-dons": setDonsRaw,
        "veh-beneficiaires": setBeneficiairesRaw,
        "veh-interventions": setInterventionsRaw,
        "veh-materiaux": setMateriauxRaw,
        "veh-adherents": setAdherentsRaw,
        "veh-travaux": setTravauxRaw,
        "veh-parcours": setParcoursRaw,
        "veh-journal": setJournalRaw,
        "veh-compteurs": applyCompteurs,
        "veh-prestataires": setPrestatairesRaw,
        "veh-depenses": setDepensesRaw,
      };
      const defaults = {
        "veh-clients": [], "veh-collaborateurs": [], "veh-appointments": [],
        "veh-passages": [], "veh-dons": [], "veh-beneficiaires": [],
        "veh-interventions": [], "veh-materiaux": [], "veh-adherents": [], "veh-travaux": [], "veh-parcours": [], "veh-journal": [],
        "veh-compteurs": {}, "veh-prestataires": [], "veh-depenses": [],
      };

      let pending = Object.keys(keys).length + 1;
      function tick() { pending -= 1; if (pending <= 0 && !cancelled) setLoaded(true); }

      // Chargement initial + écoute en temps réel : si un autre appareil modifie
      // une donnée, cet onglet se met à jour tout seul, sans recharger la page.
      unsubscribers = Object.entries(keys).map(([key, setter]) =>
        db.collection("veh_data").doc(key).onSnapshot(
          (snap) => {
            // Un document illisible ne doit pas empêcher le reste de charger :
            // sans ce garde, l'exception remonte, tick() n'est jamais appelé et
            // l'application reste bloquée sur « Chargement des données... ».
            let data = defaults[key];
            try {
              if (snap.exists) data = JSON.parse(snap.data().value);
            } catch (e) {
              data = defaults[key];
            }
            if (!cancelled) setter(data);
            tick();
          },
          () => { if (!cancelled) setter(defaults[key]); tick(); }
        )
      );

      unsubscribers.push(db.collection("veh_data").doc("veh-admin").onSnapshot(
        (snap) => {
          let adm = { appUrl: "" };
          try {
            if (snap.exists) adm = JSON.parse(snap.data().value);
          } catch (e) { /* document illisible : on garde les valeurs par défaut */ }
          if (!cancelled) setAppUrlRaw((adm && adm.appUrl) || "");
          tick();
        },
        () => { tick(); }
      ));
    })();

    return () => { cancelled = true; unsubscribers.forEach((u) => u && u()); };
  }, [authEtat, compte && compte.uid, compte && compte.role]);

  const adminTabGroups = [
    { label: "Conciergerie", tabs: [
      { id: "calendrier", label: "Calendrier", icon: CalendarIcon },
      { id: "clients", label: "Clients", icon: Users },
      { id: "contrat", label: "Contrat", icon: FileCheck2 },
      { id: "devis", label: "Devis", icon: FileText },
      { id: "passages", label: "Passages", icon: ClipboardCheck },
    ]},
    { label: "Solidaire", tabs: [
      { id: "solidaire", label: "Solidaire", icon: Wrench },
      { id: "materiaux", label: "Matériaux", icon: Package },
      { id: "insertion", label: "Insertion", icon: TrendingUp },
    ]},
    { label: "Argent", tabs: [
      { id: "dons", label: "Dons", icon: Heart },
      { id: "travaux", label: "Travaux", icon: Hammer },
      { id: "prestataires", label: "Prestataires", icon: Briefcase },
      { id: "depenses", label: "Dépenses", icon: TrendingDown },
      { id: "bilan", label: "Bilan", icon: Calculator },
    ]},
    { label: "Administration", tabs: [
      { id: "equipe", label: "Équipe", icon: UserPlus },
      { id: "adherents", label: "Adhérents", icon: IdCard },
      { id: "impact", label: "Impact", icon: BarChart3 },
      { id: "echeances", label: "Échéances", icon: Bell },
      { id: "journal", label: "Journal", icon: History },
      { id: "comptes", label: "Comptes", icon: ShieldCheck },
      { id: "sauvegarde", label: "Sauvegarde", icon: Save },
      { id: "compte", label: "Mon compte", icon: Lock },
    ]},
  ];
  const collabTabsLimited = [
    { id: "calendrier", label: "Calendrier", icon: CalendarIcon },
    { id: "contrat", label: "Contrat", icon: FileCheck2 },
    { id: "passages", label: "Passages", icon: ClipboardCheck },
    { id: "solidaire", label: "Solidaire", icon: Wrench },
    { id: "mesfrais", label: "Mes frais", icon: TrendingDown },
    { id: "compte", label: "Mon compte", icon: Lock },
  ];

  const loggedCollab = collaborateurs.find((c) => c.id === loggedCollabId);
  const libelleRole = { admin: "Administrateur", collab: "Collaborateur", client: "Espace client" };

  function deconnexion() {
    firebase.auth().signOut().catch(() => {});
    setTab("calendrier");
  }

  return (
    <div className="veh-shell" style={{ background: C.bg, color: C.text, minHeight: "100%", fontFamily: "'Inter', system-ui, sans-serif", padding: 22 }}>
      <style>{`
        /* Pas d'appel à fonts.googleapis.com : charger une police depuis un
           serveur tiers transmet l'adresse IP de chaque visiteur, ce que la
           CNIL considère comme un traitement à éviter. Les polices ci-dessous
           sont celles du système ; si 'Fraunces' ou 'Inter' sont installées
           localement, elles sont utilisées, sinon on retombe proprement. */
        * { box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: ${C.border}; border-radius: 4px; }
        select, input { color-scheme: dark; }

        @media (max-width: 720px) {
          .veh-shell { padding: 12px !important; }
          .veh-grid { grid-template-columns: 1fr !important; gap: 10px !important; }
          .veh-header { gap: 10px !important; }
          .veh-headerctrls { width: 100%; justify-content: space-between !important; }
          .veh-rolepill { flex: 1; }
          .veh-rolebtn { padding: 8px 8px !important; font-size: 11px !important; flex: 1; }
          .veh-tabbtn { padding: 8px 10px !important; font-size: 12px !important; }
          .veh-tabgroup { flex-direction: column !important; align-items: flex-start !important; gap: 4px !important; }
          .veh-cal-grid { gap: 2px !important; }
          .veh-cal-cell { min-height: 44px !important; padding: 3px !important; }
          input, select, textarea { font-size: 16px !important; }
          textarea { height: 260px !important; }
        }
        @media (max-width: 420px) {
          .veh-rolebtn { font-size: 10px !important; padding: 7px 4px !important; }
          .veh-tabbtn span, .veh-tabbtn { font-size: 11px !important; }
        }
      `}</style>

      {authEtat === "nonconfigure" ? (
        <Card style={{ padding: 28, maxWidth: 620, margin: "40px auto" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
            <AlertTriangle size={18} color={C.red} />
            <div style={{ fontWeight: 700, fontSize: 15, color: C.red }}>Application non configurée</div>
          </div>
          <div style={{ fontSize: 13, color: C.text, lineHeight: 1.6 }}>
            Le bloc <code>firebaseConfig</code>, en haut du fichier <code>index.html</code>, contient encore le texte
            d'exemple. Tant qu'il n'est pas remplacé par les identifiants de votre projet Firebase, aucune donnée ne peut
            être lue ni enregistrée, et personne ne peut se connecter.
            <br /><br />
            La marche à suivre complète est écrite en commentaire juste au-dessus de ce bloc, dans le fichier.
          </div>
        </Card>
      ) : authEtat === "verification" || (authEtat === "connecte" && !loaded) ? (
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", minHeight: "60vh", gap: 14 }}>
          <img src={LOGO_ICON} alt="Vosges Entraide Habitat" style={{ width: 64, height: 64, objectFit: "contain" }} />
          <div style={{ color: C.textMuted, fontSize: 13 }}>Chargement des données...</div>
        </div>
      ) : authEtat === "anonyme" ? (
        <Login />
      ) : authEtat === "refuse" ? (
        <Card style={{ padding: 28, maxWidth: 420, margin: "40px auto" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
            <Lock size={18} color={C.amber} />
            <div style={{ fontWeight: 700, fontSize: 15 }}>Accès non autorisé</div>
          </div>
          <div style={{ fontSize: 13, color: C.textMuted, lineHeight: 1.6, marginBottom: 16 }}>
            Votre identification a réussi, mais aucun droit n'est associé à ce compte — ou il a été révoqué.
            Contactez l'administrateur de l'association.
          </div>
          <Btn variant="ghost" onClick={deconnexion}><LogOut size={13} /> Se déconnecter</Btn>
        </Card>
      ) : (
      <>
      {storageError && (
        <div style={{ background: "rgba(248,113,113,0.1)", border: `1px solid ${C.red}`, color: C.red, borderRadius: 9, padding: 10, fontSize: 12, marginBottom: 14 }}>
          La base de données partagée (Firebase) n'a pas répondu. Vérifiez votre connexion internet ; si le problème persiste, vérifiez les règles Firestore décrites en haut du fichier.
        </div>
      )}

      <div className="veh-header" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20, flexWrap: "wrap", gap: 12 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{ width: 46, height: 46, borderRadius: 11, background: "#fff", display: "flex", alignItems: "center", justifyContent: "center", padding: 5 }}>
            <img src={LOGO_ICON} alt="Vosges Entraide Habitat" style={{ width: "100%", height: "100%", objectFit: "contain" }} />
          </div>
          <div>
            <div style={{ fontFamily: "'Fraunces', Georgia, 'Times New Roman', serif", fontWeight: 700, fontSize: 19, lineHeight: 1.1 }}>Vosges Entraide Habitat</div>
            <div style={{ fontSize: 11.5, color: C.textMuted }}>Conciergerie · Bricolage solidaire · Insertion</div>
          </div>
        </div>
        <div className="veh-headerctrls" style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 13, fontWeight: 600 }}>{actorLabel()}</div>
            <div style={{ fontSize: 11, color: C.amber }}>{libelleRole[role] || role}</div>
          </div>
          <Btn variant="ghost" onClick={deconnexion}><LogOut size={13} /> Déconnexion</Btn>
        </div>
      </div>

      {role === "admin" && (
        <>
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 20 }}>
            {adminTabGroups.map((group) => (
              <div key={group.label} className="veh-tabgroup" style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                <span style={{ fontSize: 10.5, fontWeight: 700, color: C.textMuted, textTransform: "uppercase", letterSpacing: "0.04em", minWidth: 84 }}>{group.label}</span>
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                  {group.tabs.map(({ id, label, icon: Icon }) => (
                    <button key={id} className="veh-tabbtn" onClick={() => setTab(id)} style={{
                      display: "flex", alignItems: "center", gap: 7, padding: "9px 16px", borderRadius: 9, cursor: "pointer",
                      border: `1px solid ${tab === id ? C.amber : C.border}`,
                      background: tab === id ? "rgba(232,163,61,0.12)" : "transparent",
                      color: tab === id ? C.amber : C.textMuted, fontSize: 13, fontWeight: 600,
                    }}>
                      <Icon size={15} /> {label}
                    </button>
                  ))}
                </div>
              </div>
            ))}
          </div>

          {tab === "calendrier" && <CalendarView clients={clients} collaborateurs={collaborateurs} appointments={appointments} setAppointments={setAppointments} />}
          {tab === "clients" && <ClientsView clients={clients} setClients={setClients} selectedClientId={selectedClientId} setSelectedClientId={setSelectedClientId} nextNumero={nextNumero} />}
          {tab === "equipe" && <CollaborateursView collaborateurs={collaborateurs} setCollaborateurs={setCollaborateurs} onAllerAuxComptes={() => setTab("comptes")} />}
          {tab === "comptes" && <ComptesView collaborateurs={collaborateurs} clients={clients} appUrl={appUrl} />}
          {tab === "contrat" && <ContratView clients={clients} setClients={setClients} readOnly={false} />}
          {tab === "devis" && <DevisView clients={clients} />}
          {tab === "passages" && <PassagesView clients={clients} passages={passages} setPassages={setPassages} nextNumero={nextNumero} />}
          {tab === "dons" && <DonsView dons={dons} setDons={setDons} nextNumero={nextNumero} />}
          {tab === "solidaire" && <SolidaireView beneficiaires={beneficiaires} setBeneficiaires={setBeneficiaires} interventions={interventions} setInterventions={setInterventions} collaborateurs={collaborateurs} />}
          {tab === "travaux" && <TravauxView travaux={travaux} setTravaux={setTravaux} nextNumero={nextNumero} />}
          {tab === "insertion" && <InsertionView parcours={parcours} setParcours={setParcours} />}
          {tab === "materiaux" && <MateriauxView materiaux={materiaux} setMateriaux={setMateriaux} beneficiaires={beneficiaires} />}
          {tab === "adherents" && <AdherentsView adherents={adherents} setAdherents={setAdherents} nextNumero={nextNumero} />}
          {tab === "impact" && <ImpactView clients={clients} beneficiaires={beneficiaires} interventions={interventions} materiaux={materiaux} dons={dons} adherents={adherents} passages={passages} parcours={parcours} travaux={travaux} depenses={depenses} />}
          {tab === "echeances" && <EcheancesView clients={clients} adherents={adherents} />}
          {tab === "journal" && <JournalView journal={journal} />}
          {tab === "bilan" && <BilanView dons={dons} passages={passages} travaux={travaux} depenses={depenses} interventions={interventions} adherents={adherents} />}
          {tab === "prestataires" && <PrestatairesView prestataires={prestataires} setPrestataires={setPrestataires} />}
          {tab === "depenses" && <DepensesView depenses={depenses} setDepenses={setDepenses} prestataires={prestataires} nextNumero={nextNumero} />}
          {tab === "sauvegarde" && (
            <SauvegardeView
              data={{
                "veh-clients": clients, "veh-collaborateurs": collaborateurs, "veh-appointments": appointments,
                "veh-passages": passages, "veh-dons": dons, "veh-beneficiaires": beneficiaires,
                "veh-interventions": interventions, "veh-materiaux": materiaux, "veh-adherents": adherents,
                "veh-travaux": travaux, "veh-parcours": parcours, "veh-journal": journal, "veh-compteurs": compteurs,
                "veh-prestataires": prestataires, "veh-depenses": depenses,
              }}
              setters={{
                "veh-clients": setClients, "veh-collaborateurs": setCollaborateurs, "veh-appointments": setAppointments,
                "veh-passages": setPassages, "veh-dons": setDons, "veh-beneficiaires": setBeneficiaires,
                "veh-interventions": setInterventions, "veh-materiaux": setMateriaux, "veh-adherents": setAdherents,
                "veh-travaux": setTravaux, "veh-parcours": setParcours, "veh-journal": setJournal, "veh-compteurs": setCompteurs,
                "veh-prestataires": setPrestataires, "veh-depenses": setDepenses,
              }}
            />
          )}
          {tab === "compte" && (
            <div style={{ display: "flex", flexDirection: "column", gap: 18, maxWidth: 380 }}>
              <StorageDiagnostic />
              <Card style={{ padding: 18 }}>
                <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 10 }}>Lien de l'application</div>
                <Field label="Adresse à transmettre aux collaborateurs">
                  <TextInput
                    value={appUrl}
                    onChange={(e) => saveAdmin({ appUrl: e.target.value })}
                    placeholder="Collez ici le lien une fois l'application partagée/publiée"
                  />
                </Field>
                <div style={{ fontSize: 11, color: C.textMuted, marginTop: 8 }}>
                  Ce lien est repris automatiquement dans le message d'invitation généré à la création d'un compte (onglet Comptes).
                </div>
              </Card>
              <ChangePasswordCard title="Mon mot de passe" />
            </div>
          )}
        </>
      )}

      {role === "collab" && (
        <>
          <div style={{ marginBottom: 14, fontSize: 13, color: C.textMuted }}>Connecté en tant que <b style={{ color: C.text }}>{loggedCollab?.nom || actorLabel()}</b>{loggedCollab?.role ? ` · ${loggedCollab.role}` : ""}</div>
          <div style={{ display: "flex", gap: 6, marginBottom: 20, flexWrap: "wrap" }}>
            {collabTabsLimited.map(({ id, label, icon: Icon }) => (
              <button key={id} className="veh-tabbtn" onClick={() => setTab(id)} style={{
                display: "flex", alignItems: "center", gap: 7, padding: "9px 16px", borderRadius: 9, cursor: "pointer",
                border: `1px solid ${tab === id ? C.amber : C.border}`,
                background: tab === id ? "rgba(232,163,61,0.12)" : "transparent",
                color: tab === id ? C.amber : C.textMuted, fontSize: 13, fontWeight: 600,
              }}>
                <Icon size={15} /> {label}
              </button>
            ))}
          </div>

          {tab === "calendrier" && <CalendarView clients={clients} collaborateurs={collaborateurs} appointments={appointments} setAppointments={setAppointments} viewerCollabId={loggedCollabId} />}
          {tab === "contrat" && <ContratView clients={clients} setClients={setClients} readOnly={true} />}
          {tab === "passages" && <PassagesView clients={clients} passages={passages} setPassages={setPassages} nextNumero={nextNumero} viewerCollabId={loggedCollabId} />}
          {tab === "solidaire" && <MesInterventionsSolidaireView beneficiaires={beneficiaires} interventions={interventions} setInterventions={setInterventions} viewerCollabId={loggedCollabId} />}
          {tab === "mesfrais" && <MesFraisView depenses={depenses} setDepenses={setDepenses} viewerCollabId={loggedCollabId} viewerCollabName={loggedCollab?.nom} />}
          {tab === "compte" && <ChangePasswordCard title="Mon mot de passe" />}
        </>
      )}

      {role === "client" && <ClientPortal clientId={compte && compte.clientId} />}

      <div style={{ marginTop: 24, fontSize: 10.5, color: C.textMuted, textAlign: "center" }}>
        Les données sont partagées entre tous les accès autorisés. Chaque personne dispose de son propre compte : ne partagez jamais vos identifiants.
      </div>

      {savedToast && (
        <div style={{
          position: "fixed", bottom: 18, left: "50%", transform: "translateX(-50%)",
          background: savedToast === "ok" ? "rgba(74,222,128,0.15)" : "rgba(248,113,113,0.15)",
          border: `1px solid ${savedToast === "ok" ? C.green : C.red}`,
          color: savedToast === "ok" ? C.green : C.red,
          borderRadius: 20, padding: "8px 16px", fontSize: 12.5, fontWeight: 600,
          display: "flex", alignItems: "center", gap: 6, zIndex: 50, boxShadow: "0 4px 14px rgba(0,0,0,0.3)",
        }}>
          {savedToast === "ok" ? <><CheckCircle2 size={14} /> Enregistré</> : <><AlertTriangle size={14} /> Échec de l'enregistrement — vérifiez que l'app est bien publiée</>}
        </div>
      )}
      </>
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
